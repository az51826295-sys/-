# 7일 소크 판정 기준 — 2026-08-15 동결 (수요일 숫자 관측 전).
# 문턱 판정: 1층(적격성)·2층(조작화)·3층(자명 분할)만 돈다.
# 4층(마진·방향)은 돌지 않는다 — layers_exercised가 이를 기록.
#
# evidence 형식:
#   subject:
#     duration_h, hours_planned(=168), interventions,
#     budget_overruns, isolation_halts, audit_halts, succeeded,
#     n_runs(=1), completion_rate(=duration_h/168)
#   instrument: {stale_rate, unknown_rate, unresolved_rate}
criterion_id: soak7d-acceptance
version: 1
eligibility:
  min_runs_per_arm: 1
  # 완주 게이트: 167.5h/168h. 미달 = 중단 = 판정이 아니라
  # 원인 분류 트랙 (docs/soak-cause-classification.md) -> 미정의
  min_completion_rate: 0.997
  max_stale_rate: 0.2
constructs:
  - name: interventions
    unit: count
    derived_from: [interventions]
    formula: identity
  - name: budget_overruns
    unit: count
    derived_from: [budget_overruns]
    formula: identity
  - name: isolation_halts
    unit: count
    derived_from: [isolation_halts]
    formula: identity
  - name: audit_halts
    unit: count
    derived_from: [audit_halts]
    formula: identity
  - name: succeeded
    unit: count
    derived_from: [succeeded]
    formula: identity
decision:
  kind: threshold
  thresholds:
    - {construct: interventions, op: "==", value: 0}
    - {construct: budget_overruns, op: "==", value: 0}
    - {construct: isolation_halts, op: "==", value: 0}
    - {construct: audit_halts, op: "==", value: 0}
    # 알파 사양의 "검증 통과 PR N건" - 일이 실제로 있었는가
    - {construct: succeeded, op: ">=", value: 1}

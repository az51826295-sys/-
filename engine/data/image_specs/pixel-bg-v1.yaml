# 픽셀 RPG 배경 스펙 v1 — 숫자는 전부 **사장님이 08-07에 동결한 아트 기준**에서 온다
# (docs/game-design-v0.md §1b: 뷰포트 640×360 + 2배 확대, 에셋당 색 수 ≤ 24,
#  반입 오라클 = 크기·색 수·투명배경·격자 정합).
# 내가 고른 숫자는 없다. 새 값이 필요하면 사장님 동결이 먼저다.
spec_id: pixel-bg-v1
inherits_from: judge-bench-v1.2
frozen_basis: "docs/game-design-v0.md §1b (2026-08-07 사용자 확정)"

public:                              # 프롬프트에 넣어도 되는 것
  scene_kind: "게임 배경(풍경)"
  logical_size: { width: 640, height: 360 }    # 뷰포트 그대로
  max_colors: 24                                # 에셋당 색 수 ≤ 24
  reference: "스타듀 밸리 급 도트 배경"          # 기준 게임(§1b)
  no_text: true                                 # 배경에 글자를 넣지 않는다

hidden:                              # 심판만 아는 것(프롬프트 주입 금지)
  alpha_binary: true                 # 반투명 픽셀은 도트에 없다
  max_logical_size: 640              # 격자 역산 결과가 이보다 크면 가짜 도트
  novelty:
    structure_hash: reject_duplicate

# 후처리(선언): 생성 AI의 고해상도 출력은 그대로는 '가짜 도트'다.
# tools/artgen/pixelize.py 로 격자에 강제 정합시킨 뒤 심판한다 —
# 이건 레지스트리 pixel_art_style 의 worker_role("이미지 생성 AI + 자체 도트
# 변환·선별")에 이미 선언돼 있는 단계이고, 내가 새로 만든 공정이 아니다.
postprocess:
  tool: tools/artgen/pixelize.py
  size: "640x360"
  colors: 24
  crop: center_16_9        # 생성기가 16:9를 못 내면 가운데를 잘라 맞춘다

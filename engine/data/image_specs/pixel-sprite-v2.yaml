# 픽셀 스프라이트 스펙 v2 — 2026-08-27 사장님 승인으로 **색 상한만** 24 → 48.
#
# 왜 바꿨나 (숫자가 아니라 사실이 이유다):
#   게임에 들어 있는 타일은 자리표시자(8장 15색, 기계가 그린 단색 블록)이고,
#   사장님이 "못 알아보겠다"고 하셨다. 진짜 오디션 타일은 낱장 31색 · 세트
#   40색이라 **24색 상한에 걸려 반입되지 못했다.** 즉 상한이 진짜 아트를 막고
#   자리표시자를 통과시키고 있었다. 48은 오디션 세트 40색을 담되 무제한은
#   아니게 잡은 값이다.
#
# 안 바꾼 것: 크기(타일 16, 아이콘 16)는 그대로다. 뷰포트 640×360에서 16px면
#   화면에 40×22칸이 들어가고, 32px로 올리면 20×11칸으로 시야가 절반이 된다.
#   읽히지 않는 원인은 크기가 아니라 색 수와 자리표시자였다.
#
# 캐릭터만 크기도 바꿨다: 스펙은 16×32인데 실제 자산(hero/merchant)은 48×48이다.
#   스펙이 현실과 어긋난 채였다. 48×48을 인정한다.
#
# v1(24색)은 지우지 않는다 — "pixel-sprite-v1"이라 적힌 옛 기록은 그 숫자로
# 판정된 것이고, 파일을 덮으면 그 기록이 거짓말이 된다.
spec_id: pixel-sprite-v2
inherits_from: judge-bench-v1.2
supersedes: pixel-sprite-v1
frozen_basis: "docs/game-design-v0.md §1b (2026-08-07) + 색 상한 48·캐릭터 48×48 (2026-08-27 사장님 승인)"

profiles:
  tile:
    logical_size: { width: 16, height: 16 }
    max_logical_size: 16
    max_colors: 48
    alpha_binary: true
  character:
    logical_size: { width: 48, height: 48 }
    max_logical_size: 48
    max_colors: 48
    alpha_binary: true
  icon:
    logical_size: { width: 16, height: 16 }
    max_logical_size: 16
    max_colors: 48
    alpha_binary: true

# 정직 조항(v1에서 그대로 가져온다): 이 스펙은 **반입 오라클**이다. 여기 걸린다고
# 그림이 나쁘다는 뜻이 아니라, 이 게임의 규격에 안 맞는다는 뜻이다. 규격을 바꾸는
# 것은 사장님 몫이고, **숫자를 보고 내가 늘리지 않는다** — 이번 변경도 내가
# 제안했지만 결정은 사장님이 하셨고, 그 사실을 여기 남긴다.

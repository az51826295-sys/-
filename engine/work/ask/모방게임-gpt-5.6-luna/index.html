<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>작은 본부</title>
<style>
:root{--bg:#161a22;--panel:#252b36;--card:#303846;--card2:#394354;--text:#f2eee5;--muted:#aeb5c1;--yellow:#e9bb4a;--gray:#9da8b7;--brown:#9b6747;--blue:#62a9d8;--red:#e56b65;--green:#78c47b}*{box-sizing:border-box}body{margin:0;background:#0d1015;color:var(--text);font-family:Arial,'Malgun Gothic',sans-serif;letter-spacing:-.2px}button{font:inherit;color:inherit;border:0;cursor:pointer}#app{width:100%;max-width:520px;min-height:800px;margin:auto;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 0 40px #000}header{height:72px;background:#202631;border-bottom:1px solid #39404b;padding:12px 16px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:20px;font-weight:bold}.day{font-size:11px;color:var(--muted);margin-top:3px}.resources{display:flex;gap:9px}.res{font-size:12px;text-align:center;min-width:44px;color:#fff}.res i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-2px}.dia i{background:#72d1e4;transform:rotate(45deg)}.gold i{background:var(--yellow)}.stone i{background:var(--gray)}.wood i{background:var(--brown)}main{height:calc(100vh - 136px);min-height:600px;overflow:auto;padding:16px 16px 90px}.title{font-size:22px;font-weight:bold;margin:2px 0 15px}.sub{color:var(--muted);font-size:13px}.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}.building{background:var(--card);border-radius:13px;padding:14px;min-height:126px;text-align:left;position:relative;transition:.15s}.building:hover{background:var(--card2);transform:translateY(-1px)}.building .ico{font-size:30px}.building h3{margin:10px 0 5px;font-size:16px}.building p{margin:0;color:var(--muted);font-size:12px}.count{position:absolute;right:12px;top:12px;color:#ffe29a;font-weight:bold;font-size:13px}.badge{display:inline-block;border-radius:5px;background:#454e5d;color:#d9e0e7;font-size:11px;padding:3px 6px;margin:2px}.bottom{position:absolute;bottom:0;left:0;right:0;height:64px;display:flex;background:#202631;border-top:1px solid #404754;z-index:5}.tab{flex:1;background:transparent;color:#a7afbb;font-size:12px}.tab strong{display:block;font-size:23px;line-height:28px}.tab.active{color:#f6d17a;background:#2d3542}.row{display:flex;align-items:center;gap:10px}.list{display:flex;flex-direction:column;gap:10px}.hero,.dungeon{background:var(--card);border-radius:12px;padding:12px}.hero{display:flex;align-items:center;gap:11px}.portrait{width:46px;height:46px;border-radius:8px;background:#657c92;display:grid;place-items:center;font-size:26px}.hero .info{flex:1}.hero b{display:block;margin-bottom:6px}.equip{display:flex;gap:4px}.slot{width:29px;height:29px;background:#1e242d;border:1px solid #596575;border-radius:5px;display:grid;place-items:center;font-size:15px}.dungeon{position:relative;margin-bottom:12px}.dungeon h3{margin:0 0 8px}.arena{height:82px;background:linear-gradient(180deg,#3e4a5b,#252c38);border-radius:8px;position:relative;overflow:hidden;border-bottom:5px solid #66734b}.ground{position:absolute;bottom:0;left:0;right:0;height:10px;background:#596246}.fighter{position:absolute;bottom:11px;font-size:26px;transition:left .4s;z-index:2}.crystal{position:absolute;bottom:10px;font-size:28px;z-index:1}.mycrystal{left:3%}.enemycrystal{right:3%}.crystalbar{position:absolute;bottom:4px;width:34%;height:5px;background:#171b22;border-radius:5px;overflow:hidden;z-index:3}.crystalbar i{display:block;height:100%;background:var(--blue);transition:width .3s}.mybar{left:1%}.enemybar{right:1%}.enemybar i{background:var(--red)}.progress{height:7px;background:#171b22;border-radius:5px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--yellow);width:48%;transition:width .3s}.dtext{font-size:12px;color:#f4d38a;margin-top:6px}.loot{position:absolute;right:12px;bottom:39px;text-align:center;font-size:22px}.loot small{display:block;color:#d7dde3;font-size:11px}.loot.over small{color:#ff7770}.skillbar{display:flex;gap:8px;margin-top:14px}.skill{background:#48586c;border-radius:8px;padding:9px 13px;font-size:12px}.skill:disabled{opacity:.5}.bigbtn{background:#596b80;border-radius:7px;padding:9px 12px;font-size:12px}.goldbtn{background:#80652e}.danger{background:#814841}.modalwrap{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;justify-content:center;z-index:20}.modalwrap.show{display:flex}.modal{width:min(520px,100%);max-height:88vh;overflow:auto;background:#252b36;border-radius:18px 18px 0 0;padding:20px 17px 28px;box-shadow:0 -8px 30px #0008}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.modal h2{margin:0;font-size:21px}.close{background:#3c4654;border-radius:50%;width:30px;height:30px}.desc{color:var(--muted);font-size:13px;margin:0 0 13px}.stat{background:#1d232c;border-radius:9px;padding:11px;margin:8px 0;color:#f7d994;font-size:14px}.upgrade{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 15px}.up{background:#5c6d78;border-radius:8px;padding:10px;font-size:12px}.up b{color:#ffda7c}.visitor,.sellrow,.recipe{background:#303846;border-radius:9px;padding:10px;margin:7px 0;display:flex;align-items:center;gap:9px}.visitor .vinfo,.recipe .vinfo{flex:1}.hire{background:#667c5b;padding:8px 10px;border-radius:7px;font-size:12px}.hint{color:var(--muted);font-size:12px;padding:10px 0}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin-top:10px}.item{background:#303846;border-radius:7px;padding:9px;text-align:center;font-size:21px;min-height:56px}.item small{display:block;font-size:11px;color:#eee}.filters{display:flex;gap:5px;flex-wrap:wrap;margin:9px 0}.chip{background:#3d4755;border-radius:14px;padding:6px 9px;font-size:11px}.chip.on{background:#8b7134}.toast{position:fixed;top:84px;left:50%;transform:translateX(-50%);background:#f2dda1;color:#24201b;padding:10px 15px;border-radius:8px;z-index:40;font-size:13px;display:none}.toast.show{display:block}.empty{padding:18px;text-align:center;color:var(--muted);background:#1c222b;border-radius:8px}.shoprow{justify-content:space-between;background:#303846;border-radius:8px;padding:12px}.price{color:#f5cf72}
</style>
</head>
<body>
<div id="app"><header><div><div class="brand">✦ 작은 본부</div><div class="day">제 7일 · 조용한 아침</div></div><div class="resources"><span class="res dia"><i></i><b id="dia">12</b></span><span class="res gold"><i></i><b id="gold">280</b></span><span class="res stone"><i></i><b id="stone">90</b></span><span class="res wood"><i></i><b id="wood">45</b></span></div></header><main id="main"></main><nav class="bottom"><button class="tab active" data-tab="home"><strong>⌂</strong>본부</button><button class="tab" data-tab="heroes"><strong>♙</strong>모험가</button><button class="tab" data-tab="dungeon"><strong>▣</strong>던전</button><button class="tab" data-tab="battle"><strong>⚔</strong>전투</button></nav></div>
<div class="modalwrap" id="modal"><section class="modal" id="modalContent"></section></div><div class="toast" id="toast"></div>
<script>
const S={tab:'home',gold:280,stone:90,wood:45,dia:12,innMax:10,innTime:360,bedMax:16,storageMax:217,workSlots:3,workSpeed:40,marketSlots:3,marketSpeed:40,storage:[['🪵',42],['⛓️',36],['🌿',58],['🪨',75]],heroes:[{name:'라온',lv:3,job:'수호자',traits:['거구','경계'],face:'🧑‍🌾'},{name:'미라',lv:2,job:'연금술사',traits:['집중','책벌레'],face:'🧝'}],visitors:[{name:'도윤',job:'정찰꾼',traits:['야생','재능'],face:'🧑‍🎤'},{name:'세나',job:'검사',traits:['무자비','축복받음'],face:'👩‍🦰'}],queue:[],loot:31,lootMax:3000,level:7,craft:0,medals:0,perma:{attack:0,crystal:0},battle:{myCrystal:100,enemyCrystal:100,skill:0,shield:0,active:true,units:[]}};
const $=s=>document.querySelector(s), esc=s=>s;
function money(){['dia','gold','stone','wood'].forEach(k=>$('#'+k).textContent=S[k])}function toast(t){let x=$('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}
function open(html){$('#modalContent').innerHTML=html;$('#modal').classList.add('show')}function close(){ $('#modal').classList.remove('show') }$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')close()});
function shell(title,body){return `<div class="modalhead"><h2>${title}</h2><button class="close" onclick="close()">×</button></div>${body}`}
function home(){let cards=[['🛏️','숙소','숙소 수용량',`${S.heroes.length<16?S.heroes.length:16}/16`,'bed'],['🍺','선술집','방문객과 동료를 만납니다',`8/${S.innMax}`,'inn'],['📦','저장소','아이템 보관 공간',`${S.storage.reduce((a,x)=>a+x[1],0)}/${S.storageMax}`,'storage'],['🪙','시장','아이템 판매와 거래','2/3','market'],['🔨','작업장','장비와 도구를 제작합니다',`${S.queue.length}/${S.workSlots}`,'work'],['🐾','보호소','작은 동물들의 보금자리','8/8','shelter']];$('#main').innerHTML=`<div class="title">본부 <span class="sub">성장하는 모험가의 집</span></div><div class="cards">${cards.map(c=>`<button class="building" onclick="building('${c[4]}')"><span class="ico">${c[0]}</span><span class="count">${c[3]}</span><h3>${c[1]}</h3><p>${c[2]}</p></button>`).join('')}</div><div style="margin-top:16px" class="sub">오늘의 기록</div><div class="stat">모험가 ${S.heroes.length}명 · 제작 대기 ${S.queue.length}개 · 던전 진행 중</div>`}
function heroes(){ $('#main').innerHTML=`<div class="title">모험가 <span class="sub">함께 걷는 사람들</span></div><div class="list">${S.heroes.map(h=>`<div class="hero"><div class="portrait">${h.face}</div><div class="info"><b>${h.name} <span class="badge">Lv.${h.lv}</span></b><span class="badge">${h.job}</span>${h.traits.map(x=>`<span class="badge">${x}</span>`).join('')}</div><div class="equip"><span class="slot">🗡️</span><span class="slot">🛡️</span><span class="slot">◇</span></div></div>`).join('')}</div><button class="bigbtn" style="margin-top:14px" onclick="shop()">상점 열기</button>`}
function dungeon(){let over=S.loot>S.lootMax,b=S.battle,u=b.units;$('#main').innerHTML=`<div class="title">던전 <span class="sub">자동 탐험</span></div><div class="dungeon"><h3>빛바랜 지하 수로 <span class="badge">층 ${S.level}</span></h3><div class="arena"><span class="crystal mycrystal">💎</span><span class="crystal enemycrystal">🔷</span><span class="crystalbar mybar"><i style="width:${b.myCrystal}%"></i></span><span class="crystalbar enemybar"><i style="width:${b.enemyCrystal}%"></i></span>${u.map((x,i)=>`<span class="fighter ${x.side==='me'?'mine':'enemy'}" style="left:${x.pos}%">${x.side==='me'?'🧙':'👹'}</span>`).join('')}<span class="ground"></span></div><div class="dtext">${b.active?'전투 중…':'전투 일시정지'} 내 수정 ${b.myCrystal} · 적 수정 ${b.enemyCrystal}</div><button class="loot ${over?'over':''}" onclick="lootModal()">🎁<small>${S.loot}/${S.lootMax>=1000?'3천':S.lootMax}</small></button></div><div class="skillbar"><button class="skill" onclick="skill(0)">✦ 파동 ${b.skill?`<small>${b.skill}초</small>`:'<small>즉시 광역</small>'}</button><button class="skill" onclick="skill(1)">🛡 보호막 ${b.skill?`<small>${b.skill}초</small>`:'<small>아군 보호</small>'}</button><button class="bigbtn" onclick="S.battle.active=!S.battle.active;render()">${b.active?'일시정지':'시작'}</button></div><div class="stat">출전 중: 라온 · 미라<br><span class="sub">모험가가 스스로 전진합니다. 다른 탭에서도 전투는 계속됩니다.</span></div></div>`}
function battle(){dungeon()}
function building(type){if(type==='inn')inn();if(type==='bed')bed();if(type==='storage')storage();if(type==='work')work();if(type==='market')market();if(type==='shelter')shelter()}
function inn(){open(shell('선술집',`<p class="desc">여행자가 잠시 쉬어 가며 동료를 찾는 곳입니다.</p><div class="stat">선술집 수용량: 8/${S.innMax}<br>06:00:00마다 새로운 방문객<br>다음 방문객: <b id="timer">5:00</b><div class="progress"><i style="width:62%"></i></div></div><div class="upgrade"><button class="up" onclick="upgrade('innMax',1,'gold',70)">수용량 +1 <b>🟡 70</b></button><button class="up" onclick="upgrade('innTime',-.1,'stone',20)">대기 시간 -10% <b>⚙ 20</b></button></div><h3>방문객</h3>${S.visitors.map((v,i)=>`<div class="visitor"><span class="portrait">${v.face}</span><div class="vinfo"><b>${v.name}</b><br><span class="badge">${v.job}</span>${v.traits.map(t=>`<span class="badge">${t}</span>`).join('')}</div><button class="hire" onclick="hire(${i})">고용하기</button></div>`).join('')}`))}
function bed(){open(shell('숙소',`<p class="desc">고용한 모험가가 머무는 편안한 방입니다.</p><div class="stat">숙소 수용량: ${S.heroes.length<16?S.heroes.length:16}/${S.bedMax}</div><button class="up" onclick="upgrade('bedMax',1,'gold',70)">수용량 +1 <b>🟡 70</b></button>`))}
function storage(){let total=S.storage.reduce((a,x)=>a+x[1],0);open(shell('저장소',`<p class="desc">모험에서 얻은 재료를 보관합니다.</p><div class="stat">저장된 아이템: <b id="stotal">${total}</b>/${S.storageMax}</div><button class="up" onclick="upgrade('storageMax',1,'stone',20)">공간 +1 <b>⚙ 20</b></button><div class="grid">${S.storage.map((x,i)=>`<button class="item hold" data-i="${i}">${x[0]}<small>${x[1]}</small></button>`).join('')}</div><div class="hint">짧게 탭 정보, 길게 판매</div>`));document.querySelectorAll('.hold').forEach(b=>{let timer;b.onpointerdown=()=>{timer=setTimeout(()=>sellItem(+b.dataset.i),550)};b.onpointerup=()=>clearTimeout(timer);b.onpointerleave=()=>clearTimeout(timer);b.onclick=()=>{if(!timer)return;toast('아이템 정보: 모험 재료');}})}
function sellItem(i){if(S.storage[i][1]<=0)return;S.storage[i][1]--;S.gold+=4;money();toast('아이템 판매 +🟡 4');storage()}
function shelter(){open(shell('보호소',`<p class="desc">작은 동료를 돌보고 함께 성장합니다.</p><div class="stat">보호소 수용량: 8/8</div><button class="up" onclick="toast('보호소가 가득 찼습니다')">공간 +1 <b>🟡 70</b></button><div class="grid">${['🐺','🦊','🐱','🦉','🐰','🐢','🐸','🐯'].map((x,i)=>`<button class="item holdpet">${x}<small>Lv.${i+1} · 전투력 ${12+i*4}</small></button>`).join('')}</div><div class="hint">길게 눌러 자동 사육 대상</div>`));document.querySelectorAll('.holdpet').forEach(b=>{let t;b.onpointerdown=()=>t=setTimeout(()=>toast('자동 사육 대상으로 지정했습니다'),550);b.onpointerup=()=>clearTimeout(t)})}
function work(){open(shell('작업장',`<p class="desc">재료를 모아 장비와 도구를 만듭니다.</p><div class="stat">대기열 슬롯: ${S.queue.length}/${S.workSlots}<br>속도 배수: ×1 + ${S.workSpeed}%</div><div class="upgrade"><button class="up" onclick="upgrade('workSlots',1,'gold',3);upgrade('workSlots',0,'stone',69)">대기열 +1 <b>🟡 3 / ⚙ 69</b></button><button class="up" onclick="upgrade('workSpeed',10,'stone',20)">속도 +10% <b>⚙ 20</b></button><button class="up" onclick="recipes()">레시피 보기</button></div>${S.queue.length?`<div class="stat">제작 중… ${S.queue.join(', ')}</div>`:'<div class="empty">대기열이 비어 있습니다</div>'}`))}
function market(){open(shell('시장',`<p class="desc">필요 없는 아이템을 방문객에게 판매합니다.</p><div class="stat">판매 슬롯: ${S.marketSlots}<br>속도 배수: ×1 + ${S.marketSpeed}%</div><button class="up" onclick="upgrade('marketSlots',1,'gold',3)">목록 +1 <b>🟡 3 / ⚙ 69</b></button><div class="empty">판매 목록이 비었습니다<br><button class="bigbtn" style="margin-top:8px" onclick="listSale()">아이템 올리기</button></div>`))}
function recipes(){open(shell('레시피',`<div class="filters"><button class="chip on">전체</button><button class="chip">재료</button><button class="chip">무기</button><button class="chip">갑옷</button><button class="chip">액세서리</button><button class="chip">정렬: 제작가능한양</button><label class="chip"><input type="checkbox" id="craftable"> 제작 가능한 것만</label></div><div id="recipes">${[['🪵×2 + ⛓️×1','🗡️ 철검'],['🌿×2 + 🪨×1','🧪 회복약'],['⛓️×3 + 🪨×2','🛡️ 작은 방패']].map((r,i)=>`<button class="recipe" onclick="craft('${r[1]}')"><span>${r[0]}</span><b class="vinfo">→ ${r[1]}</b><span>제작</span></button>`).join('')}</div>`))}
function craft(name){if(S.queue.length>=S.workSlots){toast('작업장 대기열이 가득 찼습니다');return}S.queue.push(name);toast('대기열에 추가했습니다');close();work()}
function listSale(){S.gold+=0;toast('아이템을 판매 목록에 올렸습니다');market()}
function lootModal(){open(shell(`전리품 - 빛바랜 지하 수로`,`<p class="desc">던전에서 누적된 재료입니다.</p><div class="grid"><div class="item">🪨<small>수정 조각 ${S.loot}</small></div><div class="item">🌿<small>빛풀 24</small></div><div class="item">⛓️<small>낡은 쇠사슬 12</small></div><div class="item">🎁<small>상자 3</small></div></div><button class="bigbtn" style="margin-top:15px" onclick="toast('탐험 보고서를 확인했습니다')">보고서</button>`))}
function shop(){open(shell('상점',`<div class="list"><div class="shoprow row"><span>🧭 초보 모험 팩<br><small class="sub">🪙 100 · 🎒 가방 확장 · 🧪 회복약 3</small></span><b class="price">🟡 100</b></div><div class="shoprow row"><span>💎 작은 다이아 묶음<br><small class="sub">💎 25 · 특별한 재료</small></span><b class="price">현금</b></div><div class="shoprow row"><span>⚔️ 장비 상자<br><small class="sub">🗡️ 무작위 무기 1</small></span><b class="price">💎 8</b></div></div>`))}
function hire(i){if(S.heroes.length>=S.bedMax){toast('숙소 수용량이 부족합니다. 숙소를 확장하세요.');return}let v=S.visitors.splice(i,1)[0];S.heroes.push({name:v.name,job:v.job,traits:v.traits,face:v.face,lv:1});toast(v.name+'을(를) 고용했습니다');money();inn()}
function upgrade(key,val,cost,res){if(S[res]<cost){toast('재화가 부족합니다');return}S[res]-=cost;if(val<1)S[key]=Math.max(60,Math.round(S[key]*(1+val)));else S[key]+=val;money();toast('업그레이드 완료');let t=key.startsWith('inn')?'inn':key.startsWith('bed')?'bed':key.startsWith('storage')?'storage':key.startsWith('work')?'work':key.startsWith('market')?'market':null;if(t)building(t)}
function resetBattle(){let hp=100;S.battle={myCrystal:hp,enemyCrystal:hp,skill:0,shield:0,active:true,spawn:0,units:[{side:'me',pos:6,hp:100},{side:'enemy',pos:94,hp:70}]}}
// 전투 수치는 한 층이 약 10~20초에 끝나도록 수정 100, 유닛 공격 12, 수정 피해 15로 정했다.
function skill(n){if(S.battle.skill>0){toast('쿨타임 '+S.battle.skill+'초');return}S.battle.skill=8;if(n===0){S.battle.units.filter(x=>x.side==='enemy').forEach(x=>x.hp-=35);toast('광역 피해!')}else{S.battle.shield=8;toast('보호막 발동')}render()}
function battleTick(){let b=S.battle;if(!b.active)return;if(b.spawn===undefined)b.spawn=0;b.spawn++;if(b.spawn%4===1){b.units.push({side:'me',pos:6,hp:100});b.units.push({side:'enemy',pos:94,hp:70})}b.units.forEach(x=>{let foe=b.units.find(y=>y.side!==x.side&&Math.abs(y.pos-x.pos)<6);if(foe){foe.hp-=x.side==='me'?14:Math.max(1,8-(b.shield?4:0))}else x.pos=x.side==='me'?Math.min(88,x.pos+10):Math.max(12,x.pos-10)});b.units=b.units.filter(x=>x.hp>0);b.units.forEach(x=>{if(x.side==='me'&&x.pos>=88)b.enemyCrystal=Math.max(0,b.enemyCrystal-20);if(x.side==='enemy'&&x.pos<=12)b.myCrystal=Math.max(0,b.myCrystal-20)});if(b.enemyCrystal<=0){S.level++;S.loot+=20;resetBattle()}else if(b.myCrystal<=0){S.level=Math.max(1,S.level-1);resetBattle()}if(b.skill>0)b.skill--;if(b.shield>0)b.shield--;if(S.tab==='dungeon'||S.tab==='battle')render()}
function render(){money();document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.tab===S.tab));if(S.tab==='home')home();if(S.tab==='heroes')heroes();if(S.tab==='dungeon')dungeon();if(S.tab==='battle')battle()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;render()});
setInterval(()=>{battleTick()},1000);setInterval(()=>{if(S.tab==='inn'){$('#timer')&&($('#timer').textContent='4:59')}},1000);render();
</script></body></html>

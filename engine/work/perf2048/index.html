<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 화살표 키 퍼즐</title>
  <style>
    :root {
      --board: #bbada0;
      --empty: rgba(238, 228, 218, 0.35);
      --text: #776e65;
      --light: #f9f6f2;
      --accent: #8f7a66;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: var(--text);
      background: #faf8ef;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game {
      width: min(100%, 500px);
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0;
      color: #776e65;
      font-size: clamp(42px, 12vw, 68px);
      line-height: 0.9;
      letter-spacing: -4px;
    }

    .subtitle {
      margin: 10px 0 0;
      font-size: 14px;
      line-height: 1.4;
    }

    .score-box {
      min-width: 92px;
      padding: 8px 14px 10px;
      border-radius: 5px;
      color: #eee4da;
      background: #bbada0;
      text-align: center;
      font-weight: bold;
      text-transform: uppercase;
    }

    .score-label {
      display: block;
      font-size: 11px;
      letter-spacing: 1px;
    }

    #score {
      display: block;
      margin-top: 2px;
      color: white;
      font-size: 25px;
      line-height: 1.1;
    }

    .controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      gap: 12px;
    }

    .help { margin: 0; font-size: 14px; }

    button {
      border: 0;
      border-radius: 4px;
      padding: 11px 15px;
      color: white;
      background: var(--accent);
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
    }

    button:hover { background: #776452; }
    button:focus-visible { outline: 3px solid #edc53f; outline-offset: 2px; }

    .board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      padding: 12px;
      border-radius: 6px;
      background: var(--board);
      aspect-ratio: 1;
      user-select: none;
    }

    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 5px;
      background: var(--empty);
      color: var(--text);
      font-size: clamp(25px, 8vw, 45px);
      font-weight: bold;
    }

    .cell[data-value="2"] { background: #eee4da; }
    .cell[data-value="4"] { background: #ede0c8; }
    .cell[data-value="8"] { background: #f2b179; color: #f9f6f2; }
    .cell[data-value="16"] { background: #f59563; color: #f9f6f2; }
    .cell[data-value="32"] { background: #f67c5f; color: #f9f6f2; }
    .cell[data-value="64"] { background: #f65e3b; color: #f9f6f2; }
    .cell[data-value="128"], .cell[data-value="256"] { background: #edcf72; color: #f9f6f2; font-size: clamp(22px, 7vw, 38px); }
    .cell[data-value="512"], .cell[data-value="1024"], .cell[data-value="2048"] { background: #edc53f; color: #f9f6f2; font-size: clamp(19px, 6vw, 34px); }

    .message {
      min-height: 28px;
      margin: 15px 0 0;
      color: #776e65;
      font-size: 20px;
      font-weight: bold;
      text-align: center;
    }

    @media (max-width: 420px) {
      body { padding: 15px; }
      .board { gap: 8px; padding: 8px; }
      header { margin-bottom: 13px; }
      .help { font-size: 12px; }
    }
  </style>
</head>
<body>
  <main class="game">
    <header>
      <div>
        <h1>2048</h1>
        <p class="subtitle">같은 숫자를 합쳐 2048을 만들어 보세요.</p>
      </div>
      <div class="score-box" aria-label="점수">
        <span class="score-label">점수</span>
        <span id="score">0</span>
      </div>
    </header>

    <div class="controls">
      <p class="help">화살표 키로 타일을 움직이세요.</p>
      <button id="restart" type="button">다시 시작</button>
    </div>

    <section id="board" class="board" aria-label="2048 게임 보드"></section>
    <p id="message" class="message" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      'use strict';

      const SIZE = 4;
      const boardElement = document.getElementById('board');
      const scoreElement = document.getElementById('score');
      const messageElement = document.getElementById('message');
      const restartButton = document.getElementById('restart');
      let board = [];
      let score = 0;
      let gameOver = false;

      function makeEmptyBoard() {
        return Array.from({ length: SIZE }, () => Array(SIZE).fill(0));
      }

      function draw() {
        boardElement.innerHTML = '';
        for (let row = 0; row < SIZE; row += 1) {
          for (let col = 0; col < SIZE; col += 1) {
            const cell = document.createElement('div');
            const value = board[row][col];
            cell.className = 'cell';
            cell.dataset.value = value === 0 ? '' : String(value);
            cell.textContent = value === 0 ? '' : String(value);
            cell.setAttribute('aria-label', value === 0 ? '빈 칸' : String(value));
            boardElement.appendChild(cell);
          }
        }
        scoreElement.textContent = String(score);
      }

      function emptyCells() {
        const cells = [];
        for (let row = 0; row < SIZE; row += 1) {
          for (let col = 0; col < SIZE; col += 1) {
            if (board[row][col] === 0) cells.push({ row, col });
          }
        }
        return cells;
      }

      function addRandomTile() {
        const cells = emptyCells();
        if (cells.length === 0) return false;
        const spot = cells[Math.floor(Math.random() * cells.length)];
        board[spot.row][spot.col] = Math.random() < 0.9 ? 2 : 4;
        return true;
      }

      function startGame() {
        board = makeEmptyBoard();
        score = 0;
        gameOver = false;
        messageElement.textContent = '';
        addRandomTile();
        addRandomTile();
        draw();
      }

      function slideLine(line) {
        const compact = line.filter(value => value !== 0);
        const result = [];
        let gained = 0;
        for (let i = 0; i < compact.length; i += 1) {
          if (compact[i] === compact[i + 1]) {
            const merged = compact[i] * 2;
            result.push(merged);
            gained += merged;
            i += 1;
          } else {
            result.push(compact[i]);
          }
        }
        while (result.length < SIZE) result.push(0);
        return { line: result, gained: gained };
      }

      function getLine(index, direction) {
        const line = [];
        for (let offset = 0; offset < SIZE; offset += 1) {
          if (direction === 'left') line.push(board[index][offset]);
          if (direction === 'right') line.push(board[index][SIZE - 1 - offset]);
          if (direction === 'up') line.push(board[offset][index]);
          if (direction === 'down') line.push(board[SIZE - 1 - offset][index]);
        }
        return line;
      }

      function setLine(index, direction, line) {
        for (let offset = 0; offset < SIZE; offset += 1) {
          if (direction === 'left') board[index][offset] = line[offset];
          if (direction === 'right') board[index][SIZE - 1 - offset] = line[offset];
          if (direction === 'up') board[offset][index] = line[offset];
          if (direction === 'down') board[SIZE - 1 - offset][index] = line[offset];
        }
      }

      function canMove() {
        if (emptyCells().length > 0) return true;
        for (let row = 0; row < SIZE; row += 1) {
          for (let col = 0; col < SIZE; col += 1) {
            if (col < SIZE - 1 && board[row][col] === board[row][col + 1]) return true;
            if (row < SIZE - 1 && board[row][col] === board[row + 1][col]) return true;
          }
        }
        return false;
      }

      function move(direction) {
        if (gameOver) return;
        let changed = false;
        let gainedThisMove = 0;

        for (let index = 0; index < SIZE; index += 1) {
          const oldLine = getLine(index, direction);
          const processed = slideLine(oldLine);
          if (processed.line.some((value, position) => value !== oldLine[position])) changed = true;
          setLine(index, direction, processed.line);
          gainedThisMove += processed.gained;
        }

        if (!changed) {
          if (!canMove()) {
            gameOver = true;
            messageElement.textContent = '게임 오버';
            draw();
          }
          return;
        }

        score += gainedThisMove;
        addRandomTile();
        draw();
        if (!canMove()) {
          gameOver = true;
          messageElement.textContent = '게임 오버';
        }
      }

      document.addEventListener('keydown', function (event) {
        const directions = {
          ArrowLeft: 'left',
          ArrowRight: 'right',
          ArrowUp: 'up',
          ArrowDown: 'down'
        };
        if (directions[event.key]) {
          event.preventDefault();
          move(directions[event.key]);
        }
      });

      restartButton.addEventListener('click', startGame);
      startGame();
    }());
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>길목 수호대</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#101827;color:#eef5ff;font-family:Arial,'Malgun Gothic',sans-serif;min-height:100vh}.screen{min-height:100vh;display:flex;align-items:center;justify-content:center}.hidden{display:none!important}
#titleScreen{background:radial-gradient(circle at 50% 35%,#294a69,#101827 65%)}.titleCard{width:min(620px,92vw);text-align:center;padding:58px 25px;border:2px solid #4e789d;border-radius:24px;background:rgba(13,25,42,.88);box-shadow:0 20px 70px #0008}.titleCard h1{font-size:clamp(38px,8vw,72px);margin:0 0 14px;color:#ffd166;text-shadow:0 4px #6e4616}.titleCard p{color:#b9cce0;font-size:18px}.bigButton,.actionButton{border:0;border-radius:10px;padding:13px 27px;background:#3ecf8e;color:#082217;font-weight:bold;font-size:19px;cursor:pointer;box-shadow:0 4px #168158}.bigButton:hover,.actionButton:hover{filter:brightness(1.12)}.record{margin:23px 0;color:#ffd166;font-size:17px}
#gameScreen{display:block;padding:12px;background:#101827}.topbar{max-width:1120px;margin:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:9px 0}.brand{font-size:22px;color:#ffd166;font-weight:bold;margin-right:auto}.hud{display:flex;gap:7px;flex-wrap:wrap}.hudBox{background:#1b2c42;border:1px solid #38536e;padding:8px 13px;border-radius:8px;font-size:16px}.hudBox b{color:#fff59b;font-size:20px;margin-left:4px}.pause{background:#e0a93a;color:#241b04;padding:9px 15px;border:0;border-radius:8px;font-weight:bold;cursor:pointer}
.layout{max-width:1120px;margin:auto;display:grid;grid-template-columns:minmax(620px,900px) 205px;gap:14px;align-items:start}.board{position:relative;width:100%;aspect-ratio:900/520;overflow:hidden;border:3px solid #405c70;border-radius:12px;background:#284c38;box-shadow:0 10px 30px #0005}.grass{position:absolute;inset:0;background-color:#28553c;background-image:radial-gradient(#47754d 1px,transparent 1px);background-size:18px 18px}.pathSvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.pathOutline{fill:none;stroke:#9a703b;stroke-width:82;stroke-linecap:round;stroke-linejoin:round}.pathInner{fill:none;stroke:#d8b66c;stroke-width:68;stroke-linecap:round;stroke-linejoin:round}.pathDash{fill:none;stroke:#efd995;stroke-width:3;stroke-dasharray:12 13;opacity:.65}
.enemy{position:absolute;width:32px;height:32px;border-radius:50%;transform:translate(-50%,-50%);z-index:5;border:2px solid #fff;box-shadow:0 2px 5px #0009;text-align:center;font-weight:bold;color:white;font-size:11px;line-height:28px}.enemy small{position:absolute;top:-19px;left:50%;transform:translateX(-50%);white-space:nowrap;font-size:11px;color:#fff;background:#162033dd;border-radius:4px;padding:1px 4px;line-height:14px}.enemy.weak{background:#e45d5d}.enemy.fast{background:#d887e8}.enemy.tank{background:#586f9e;width:38px;height:38px;line-height:34px}.tower{position:absolute;transform:translate(-50%,-50%);width:43px;height:43px;border-radius:10px;border:3px solid #dcecff;z-index:7;text-align:center;color:white;font-size:11px;font-weight:bold;cursor:pointer;box-shadow:0 2px 6px #0009}.tower span{display:block;line-height:15px;text-shadow:1px 1px #000}.tower.arrow{background:#3c9ee8}.tower.cannon{background:#e2813a}.tower.tesla{background:#a35ce0}.tower .towerStats{position:absolute;top:43px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#142236dd;border-radius:4px;padding:1px 3px;font-size:10px;color:#ffef9d}.bullet{position:absolute;width:9px;height:9px;border-radius:50%;background:#fff48c;box-shadow:0 0 8px #ffe95b;z-index:8;pointer-events:none}.rangeRing{position:absolute;border:1px dashed #fff9;border-radius:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none}.side{background:#192a3e;border:1px solid #38536e;border-radius:12px;padding:12px}.side h2{font-size:17px;margin:0 0 9px;color:#ffd166}.towerChoice{width:100%;text-align:left;padding:9px 7px;margin:6px 0;border:1px solid #47637c;background:#243b55;color:#fff;border-radius:8px;cursor:pointer}.towerChoice.selected{outline:3px solid #ffd166;background:#315b70}.towerChoice b{display:block}.towerChoice small{display:block;color:#bdd1e5;line-height:17px}.towerChoice em{float:right;color:#ffec76;font-style:normal}.towerInfo{margin-top:12px;border-top:1px solid #446079;padding-top:9px;color:#bcd0e2;min-height:72px;font-size:13px}.towerInfo button{margin:4px 2px 0 0;border:0;border-radius:5px;padding:7px 8px;cursor:pointer;font-weight:bold}.upgrade{background:#ffd166}.sell{background:#ee7464;color:#30100c}.hint{font-size:12px;color:#91abc0;line-height:17px;margin-top:12px}.toast{position:absolute;z-index:20;left:50%;top:14px;transform:translateX(-50%);background:#17283ddd;border:1px solid #ffd166;color:#fff3b0;border-radius:8px;padding:9px 16px;pointer-events:none}.gameOverCard{background:#192a3e;border:2px solid #e45d5d;border-radius:20px;text-align:center;padding:42px 55px;box-shadow:0 12px 50px #0008}.gameOverCard h1{color:#ff7777;font-size:48px;margin:0 0 15px}.gameOverCard p{font-size:20px;color:#d6e5f3}.gameOverCard b{color:#ffd166;font-size:27px}
@media(max-width:850px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.side h2,.towerInfo,.hint{grid-column:1/-1}.towerChoice{margin:0}.brand{width:100%}.board{min-width:0}.topbar{padding:5px}}
</style>
</head>
<body>
<section id="titleScreen" class="screen"><div class="titleCard"><h1>길목 수호대</h1><p>길을 따라 몰려오는 적을 막아 마을을 지켜라!</p><div class="record">최고 기록 웨이브: <b id="highScore">0</b></div><button id="startButton" class="bigButton">시작</button></div></section>
<section id="gameScreen" class="hidden">
  <div class="topbar"><div class="brand">🛡 길목 수호대</div><div class="hud"><div class="hudBox">돈 <b id="money">320</b></div><div class="hudBox">목숨 <b id="lives">20</b></div><div class="hudBox">웨이브 <b id="wave">1</b> / 10</div></div><button id="pauseButton" class="pause">일시정지</button></div>
  <div class="layout"><div id="board" class="board"><div class="grass"></div><svg class="pathSvg" viewBox="0 0 900 520" preserveAspectRatio="none"><polyline class="pathOutline" points="0,100 180,100 180,380 420,380 420,170 700,170 700,430 900,430"/><polyline class="pathInner" points="0,100 180,100 180,380 420,380 420,170 700,170 700,430 900,430"/><polyline class="pathDash" points="0,100 180,100 180,380 420,380 420,170 700,170 700,430 900,430"/></svg><div id="toast" class="toast hidden"></div></div>
  <aside class="side"><h2>타워 선택</h2><button class="towerChoice" data-type="arrow"><b>🏹 화살 타워 <em>65G</em></b><small>사거리 145 · 공격력 12 · 연사 0.65초</small></button><button class="towerChoice" data-type="cannon"><b>💣 대포 타워 <em>110G</em></b><small>사거리 115 · 공격력 30 · 연사 1.1초</small></button><button class="towerChoice" data-type="tesla"><b>⚡ 번개 타워 <em>170G</em></b><small>사거리 190 · 공격력 8 · 연사 0.25초</small></button><div id="towerInfo" class="towerInfo">타워를 선택한 뒤 길이 아닌 빈 곳을 누르세요.</div><div class="hint">적 유형: <b style="color:#e45d5d">약한 적</b> · <b style="color:#d887e8">빠른 적</b> · <b style="color:#7895c9">튼튼한 적</b><br>타워를 누르면 업그레이드와 판매를 할 수 있습니다.</div></aside></div>
</section>
<section id="overScreen" class="screen hidden"><div class="gameOverCard"><h1>게임 오버</h1><p>마을의 목숨이 모두 소진되었습니다.</p><p>도달한 웨이브: <b id="finalWave">1</b></p><button id="retryButton" class="bigButton">다시 하기</button></div></section>
<script>
const board=document.getElementById('board'), moneyEl=document.getElementById('money'), livesEl=document.getElementById('lives'), waveEl=document.getElementById('wave'), toastEl=document.getElementById('toast');
const towerData={arrow:{name:'화살',cost:65,range:145,damage:12,rate:650,color:'arrow'},cannon:{name:'대포',cost:110,range:115,damage:30,rate:1100,color:'cannon'},tesla:{name:'번개',cost:170,range:190,damage:8,rate:250,color:'tesla'}};
const route=[{x:0,y:100},{x:180,y:100},{x:180,y:380},{x:420,y:380},{x:420,y:170},{x:700,y:170},{x:700,y:430},{x:900,y:430}];let lengths=[],totalLength=0;for(let i=1;i<route.length;i++){let d=Math.hypot(route[i].x-route[i-1].x,route[i].y-route[i-1].y);lengths.push(d);totalLength+=d}
let state,loop,selectedType='arrow',idCounter=0;
function resetGame(){state={money:320,lives:20,wave:1,enemies:[],towers:[],bullets:[],spawned:0,nextSpawn:0,last:performance.now(),paused:false,between:0,over:false};document.getElementById('titleScreen').classList.add('hidden');document.getElementById('overScreen').classList.add('hidden');document.getElementById('gameScreen').classList.remove('hidden');document.querySelectorAll('.tower').forEach(e=>e.remove());document.querySelectorAll('.enemy,.bullet,.rangeRing').forEach(e=>e.remove());updateHud();selectTower('arrow');clearInterval(loop);loop=setInterval(tick,40)}
function updateHud(){moneyEl.textContent=Math.floor(state.money);livesEl.textContent=state.lives;waveEl.textContent=state.wave}
function showToast(msg){toastEl.textContent=msg;toastEl.classList.remove('hidden');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toastEl.classList.add('hidden'),1900)}
function selectTower(type){selectedType=type;document.querySelectorAll('.towerChoice').forEach(b=>b.classList.toggle('selected',b.dataset.type===type));document.getElementById('towerInfo').innerHTML='<b>'+towerData[type].name+' 타워 선택됨</b><br>빈 칸을 눌러 설치하세요.'}
document.querySelectorAll('.towerChoice').forEach(b=>b.onclick=()=>selectTower(b.dataset.type));
function pointAt(dist){let d=Math.max(0,dist);for(let i=0;i<lengths.length;i++){if(d<=lengths[i]){let a=route[i],b=route[i+1],r=d/lengths[i];return{x:a.x+(b.x-a.x)*r,y:a.y+(b.y-a.y)*r}}d-=lengths[i]}return route[route.length-1]}
function distToSegment(px,py,a,b){let dx=b.x-a.x,dy=b.y-a.y,t=((px-a.x)*dx+(py-a.y)*dy)/(dx*dx+dy*dy);t=Math.max(0,Math.min(1,t));return Math.hypot(px-(a.x+t*dx),py-(a.y+t*dy))}
function onPath(x,y){for(let i=1;i<route.length;i++)if(distToSegment(x,y,route[i-1],route[i])<49)return true;return false}
board.onclick=function(e){if(e.target.closest('.tower'))return;let r=board.getBoundingClientRect(),x=(e.clientX-r.left)*900/r.width,y=(e.clientY-r.top)*520/r.height;if(onPath(x,y)){showToast('길 위에는 타워를 놓을 수 없습니다.');return}let d=towerData[selectedType];if(state.money<d.cost){showToast('돈이 부족합니다! 필요한 돈: '+d.cost+'G');return}if(state.towers.some(t=>Math.hypot(t.x-x,t.y-y)<43)){showToast('타워가 너무 가까이 있습니다.');return}state.money-=d.cost;let t={id:++idCounter,type:selectedType,x,y,level:1,damage:d.damage,range:d.range,rate:d.rate,cool:0,el:null};state.towers.push(t);drawTower(t);updateHud()};
function drawTower(t){let el=document.createElement('div');el.className='tower '+t.type;el.style.left=(t.x/900*100)+'%';el.style.top=(t.y/520*100)+'%';el.innerHTML='<span>'+({arrow:'🏹',cannon:'💣',tesla:'⚡'}[t.type])+'</span><div class="towerStats">Lv'+t.level+' D'+t.damage+'</div>';el.onclick=e=>{e.stopPropagation();openTower(t)};board.appendChild(el);t.el=el}
function openTower(t){let inf=document.getElementById('towerInfo');inf.innerHTML='<b>'+towerData[t.type].name+' 타워 Lv'+t.level+'</b><br>공격력 '+t.damage+' · 사거리 '+t.range+' · 연사 '+(t.rate/1000).toFixed(2)+'초<br><button class="upgrade">업그레이드 '+(55*t.level)+'G</button><button class="sell">판매 +'+Math.floor(towerData[t.type].cost*.6*t.level)+'G</button>';inf.querySelector('.upgrade').onclick=()=>upgrade(t);inf.querySelector('.sell').onclick=()=>sell(t);let ring=document.createElement('div');ring.className='rangeRing';ring.style.left=t.x/900*100+'%';ring.style.top=t.y/520*100+'%';ring.style.width=t.range/900*100*2+'%';ring.style.height=t.range/520*100*2+'%';board.appendChild(ring);setTimeout(()=>ring.remove(),1800)}
function upgrade(t){let cost=55*t.level;if(state.money<cost){showToast('업그레이드할 돈이 부족합니다.');return}state.money-=cost;t.level++;t.damage+=Math.ceil(t.damage*.35);t.range+=12;t.rate=Math.max(120,t.rate-35);t.el.querySelector('.towerStats').textContent='Lv'+t.level+' D'+t.damage;updateHud();openTower(t)}
function sell(t){state.money+=Math.floor(towerData[t.type].cost*.6*t.level);t.el.remove();state.towers=state.towers.filter(x=>x!==t);document.getElementById('towerInfo').textContent='타워를 선택한 뒤 길이 아닌 빈 곳을 누르세요.';updateHud()}
function spawnEnemy(){let n=state.spawned%3,type=n===0?'weak':n===1?'fast':'tank',base={weak:{hp:42,speed:47,reward:12},fast:{hp:27,speed:82,reward:16},tank:{hp:115,speed:28,reward:28}}[type],scale=1+(state.wave-1)*.16;let e={id:++idCounter,type,hp:Math.round(base.hp*scale),maxHp:Math.round(base.hp*scale),speed:base.speed*(1+(state.wave-1)*.025),reward:base.reward+state.wave,dist:0,el:null};state.enemies.push(e);let el=document.createElement('div');el.className='enemy '+type;el.innerHTML='<small>'+({weak:'약한',fast:'빠른',tank:'튼튼한'}[type])+'</small><span>'+e.hp+'</span>';board.appendChild(el);e.el=el;state.spawned++}
function removeEnemy(e,escaped){if(e.el)e.el.remove();state.enemies=state.enemies.filter(x=>x!==e);if(escaped){state.lives--;showToast('적이 길 끝에 도착했습니다!');}else state.money+=e.reward;updateHud();if(state.lives<=0)gameOver()}
function tick(){if(!state||state.over||state.paused)return;let now=performance.now(),dt=Math.min(80,now-state.last);state.last=now;let sec=dt/1000;if(state.spawned<5+state.wave*2){state.nextSpawn-=dt;if(state.nextSpawn<=0){spawnEnemy();state.nextSpawn=620-Math.min(280,state.wave*15)}}else if(state.enemies.length===0){state.between+=dt;if(state.wave<10&&state.between>1000){state.wave++;state.spawned=0;state.nextSpawn=0;state.between=0;updateHud();showToast('웨이브 '+state.wave+' 시작!')}}
state.enemies.slice().forEach(e=>{e.dist+=e.speed*sec;if(e.dist>=totalLength){removeEnemy(e,true);return}let p=pointAt(e.dist);e.el.style.left=p.x/900*100+'%';e.el.style.top=p.y/520*100+'%'});
state.towers.forEach(t=>{t.cool-=dt;if(t.cool<=0){let target=state.enemies.find(e=>{let p=pointAt(e.dist);return Math.hypot(p.x-t.x,p.y-t.y)<=t.range});if(target){t.cool=t.rate;let b={x:t.x,y:t.y,target,damage:t.damage,el:null};let el=document.createElement('div');el.className='bullet';board.appendChild(el);b.el=el;state.bullets.push(b)}}});
state.bullets.slice().forEach(b=>{if(!state.enemies.includes(b.target)){b.el.remove();state.bullets=state.bullets.filter(x=>x!==b);return}let p=pointAt(b.target.dist),dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy),step=500*sec;if(d<=step){b.target.hp-=b.damage;b.target.el.querySelector('span').textContent=Math.max(0,b.target.hp);b.el.remove();state.bullets=state.bullets.filter(x=>x!==b);if(b.target.hp<=0)removeEnemy(b.target,false)}else{b.x+=dx/d*step;b.y+=dy/d*step;b.el.style.left=b.x/900*100+'%';b.el.style.top=b.y/520*100+'%'}})}
function gameOver(){if(state.over)return;state.over=true;clearInterval(loop);let old=Number(localStorage.getItem(' 길목수호대 최고기록')||0);if(state.wave>old)localStorage.setItem(' 길목수호대 최고기록',state.wave);document.getElementById('finalWave').textContent=state.wave;document.getElementById('gameScreen').classList.add('hidden');document.getElementById('overScreen').classList.remove('hidden')}
document.getElementById('pauseButton').onclick=()=>{state.paused=!state.paused;document.getElementById('pauseButton').textContent=state.paused?'다시 시작':'일시정지';showToast(state.paused?'일시정지되었습니다.':'게임을 계속합니다.')};document.getElementById('startButton').onclick=resetGame;document.getElementById('retryButton').onclick=resetGame;
let best=Number(localStorage.getItem(' 길목수호대 최고기록')||0);document.getElementById('highScore').textContent=best;
</script>
</body>
</html>

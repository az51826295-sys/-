<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>잿빛 원정대</title>
<style>
  /*
   * 10-04 사장님 결정: **그림과 글, 턴제, 도트.** 첫 시스템(길드)을 그대로 쓴다.
   *
   * 그림은 작게 위에, **글이 아래에서 크게 흐른다.** 글이 주인공이다 —
   * 캐릭터가 늙고 죽는 것은 도트가 사라지는 것보다 **문장으로 읽을 때** 훨씬 세다.
   * 그래서 그림 50장이 아니라 7장으로도 게임이 선다. 이게 사장님이 말한 효율이다.
   */
  /*
   * 10-17 사장님: 전투 화면을 **꾹 누르면** 안드로이드 브라우저의 이미지 메뉴가 떴다
   * ("이미지 공유 · 다운로드 · 복사 · 보기"). 게임에서 꾹 누르기는 아무 일도 없어야 한다.
   * `user-select:none` 만으로는 안 막힌다 — 그건 **글자 선택**만 막는다.
   * 그림 메뉴는 `-webkit-touch-callout` 과 contextmenu 를 같이 막아야 한다(아래 스크립트).
   * 이 창엔 글자 입력칸이 하나도 없어서 전부에 걸어도 깨지는 곳이 없다(세어 봤다).
   */
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;
    -webkit-touch-callout:none;-webkit-user-drag:none;
    font-family:"Malgun Gothic",sans-serif}
  img,canvas{-webkit-user-drag:none;user-drag:none}
  /*
   * **도트 RPG 창** (10-07 사장님). 색은 야영지 배경에서 뽑았다 — 저녁 보라 + 모닥불 주황.
   * 창 하나 = 진한 테두리 3px + 안쪽 밝은 선/어두운 선(볼록) + 모서리 한 칸 깎기.
   */
  :root{--밤:#1a1420;--창:#2c2236;--창속:#221a2a;--테:#0d0910;--빛테:#7a6290;--그늘:#170f1d;
        --금:#f2b45a;--글:#f1e4c8;--흐림:#a8977f;--초록:#8fe08f}
  body{background:var(--밤);color:var(--글);overflow:hidden}
  #app{position:relative;width:100vw;height:100vh;display:flex;flex-direction:column;overflow:hidden}

  #top,.rbtn,#bond,.btn,#panel.open,.tab,#board,.tag{
    border:3px solid var(--테);
    box-shadow:inset 2px 2px 0 var(--빛테),inset -2px -2px 0 var(--그늘);
    clip-path:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),
      calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}

  #top{margin:4px 4px 0;padding:6px 10px;background:var(--창);
       display:flex;justify-content:space-between;align-items:center;font-size:13px;text-shadow:1px 1px 0 #000}
  /* 윗줄은 **한 줄**이어야 한다 — 가방 단추를 더했더니 층 이름이 두 줄로 접혔다(10-10) */
  #top{flex-wrap:nowrap}
  #top .zone{color:var(--금);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  #top .res{flex:none;white-space:nowrap}
  #top .res{display:flex;gap:10px;color:var(--글)}
  #top .res img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px}
  /* 소리 단추 — 켜고 끄는 것은 늘 보이는 자리에 둔다. 끌 수 없는 음악은 지우고 싶은 앱이 된다. */
  #sndBtn{background:none;border:0;color:var(--금);font:inherit;font-size:15px;line-height:1;
          padding:0 2px;cursor:pointer;opacity:.95}
  /* 어디서든 열리는 가방 (10-10 사장님 "독립된 그리드 아이템창 신설") */
  #가방단추{background:none;border:0;color:var(--금);font:inherit;font-size:12px;line-height:1;
            padding:0 4px;cursor:pointer;opacity:.95;white-space:nowrap}
  #sndBtn.off{color:var(--글);opacity:.35;text-decoration:line-through}

  /* 그림은 작게 — 자리만 잡는다 */
  #board{height:170px;position:relative;margin:4px 4px 0;background:linear-gradient(#2a1f33,#1c1524 70%,#3a2c2a);overflow:hidden}
  #board canvas{position:absolute;inset:0;width:100%;height:100%}
  #board.접음{display:none}   /* 탑을 고르는 동안엔 전투 칸을 접는다 (10-09 사장님) */

  /* 글이 본문 */
  #log{flex:1;overflow-y:auto;padding:10px 12px 16px;font-size:15px;line-height:1.75}
  #log .l{margin:2px 0;color:#c9b9a0}
  #log .hit{color:#fff3dc}
  #log .big{color:var(--금);font-size:17px;margin:7px 0}
  #log .bad{color:#ff8e7a}
  #log .die{color:#ff6b5b;font-size:17px;margin:9px 0;border-left:3px solid #ff6b5b;padding-left:9px}
  #log .good{color:var(--초록)}
  #log .turn{color:#6e5d78;font-size:12px;margin-top:9px}
  #고르기{margin:6px 4px 0;padding:8px 10px;background:var(--창);display:none}
  #고르기.on{display:block}
  #고르기 .말{font-size:13px;color:var(--글);margin-bottom:7px}
  #고르기 .층들{display:flex;flex-wrap:wrap;gap:5px;max-height:104px;overflow-y:auto}
  #고르기 .ch{padding:4px 9px;font-size:13px;color:var(--글);background:#2a1f33;
              border:1px solid #4a3a55;cursor:pointer}
  #고르기 .ch.새{color:var(--금);border-color:var(--금)}
  #고르기 .ch.고름{background:var(--금);color:#1a1420;border-color:var(--금)}
  #고르기 .줄{display:flex;gap:6px;margin-top:8px;align-items:center}
  #고르기 .줄 .btn{flex:1}
  /* 탑 맵 (10-09 사장님 "탑에 약간 맵같이 스크롤로") — 꼭대기가 위, 1층이 아래. 올라가는 느낌을 세로로 준다. */
  #맵{flex:1;overflow-y:auto;margin:4px;background:#0f0a14;position:relative;display:none}
  #맵.on{display:block}
  /* 맵이 떠 있을 땐 글 칸을 접는다 — 둘이 공간을 반씩 나눠 가져 맵이 8층쯤에서 잘렸다 */
  #맵.on ~ #log{display:none}
  /* 탑 그림: 기둥을 이어 붙인다. 꼭대기 한 장은 **100층을 열었을 때만** — 13층인데 꼭대기가
     보이면 다 오른 것처럼 보이고, 층이 적을 땐 탑이 포스터처럼 떠 있었다(10-09 사장님 "이상해"). */
  #맵 .탑{position:absolute;inset:0;background-image:url(art/tower-shaft.png);
          background-repeat:repeat-y;image-rendering:pixelated;opacity:.52;overflow:hidden}
  #맵 .꼭대기{display:block;margin:0 auto;image-rendering:pixelated}
  /* 위로 갈수록 어둠에 묻힌다 — "아직 위가 더 있다" */
  #맵 .안개{position:absolute;left:0;right:0;top:0;height:90px;pointer-events:none;
            background:linear-gradient(var(--밤),rgba(26,20,32,0))}
  /* 층이 몇 개 없어도 탑은 화면 끝까지 선다 — 중간에 뚝 끊기면 탑이 아니라 그림 조각이 된다 */
  #맵 .속{position:relative;padding:10px 0;min-height:100%}
  #맵 .층들{position:relative}
  /* 전투 중에 탑으로 돌아가는 길 — 이게 없어서 한번 떠나면 맵을 영영 못 봤다 */
  #탑버튼{position:absolute;right:10px;top:10px;z-index:5;display:none;
          background:rgba(20,14,26,.82);border:2px solid var(--빛테);color:var(--금);
          font:inherit;font-size:12px;padding:4px 9px;cursor:pointer}
  #탑버튼.on{display:block}
  /* 자동 등반 — 자격이 찬 순간 오른다. 자격을 건너뛰지는 않는다(10-09 사장님 선택 2번). */
  #자동버튼{position:absolute;right:62px;top:10px;z-index:5;display:none;
            background:rgba(20,14,26,.82);border:2px solid #4a3a55;color:#6e5d78;
            font:inherit;font-size:12px;padding:4px 9px;cursor:pointer}
  #자동버튼.on{display:block}
  #자동버튼.켬{border-color:var(--빛테);color:var(--초록)}
  /* 관문 자격 — 10·20·30… 층에서만 뜬다. 뭐가 남았는지 전투 화면에서 바로 본다 (10-10 사장님) */
  #자격버튼{position:absolute;right:150px;top:10px;z-index:5;display:none;
            background:rgba(20,14,26,.82);border:2px solid #d9534f;color:#ff9a8a;
            font:inherit;font-size:12px;padding:4px 9px;cursor:pointer}
  #자격버튼.on{display:block}
  #자격버튼.참{border-color:var(--초록);color:var(--초록)}
  /* 칸을 좁혀 탑이 양옆으로 보이게 한다 — 꽉 채우면 탑 그림이 벽지가 되고 그냥 목록으로 읽힌다 */
  #맵 .층칸{width:78%;margin:0 auto 8px;padding:7px 10px;
            background:rgba(20,14,26,.82);border:1px solid #3a2c45;cursor:pointer}
  #맵 .머리줄{display:flex;align-items:center;gap:8px}
  /* 자격 — 뭐가 남았는지가 이 게임의 길잡이다 */
  #맵 .자격줄{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:4px}
  #맵 .조건{color:#6e5d78;font-size:11px;border-left:2px solid #3a2c45;padding-left:5px}
  #맵 .조건 b{color:#a8977f;font-weight:400}
  #맵 .조건.참{color:var(--초록);border-left-color:var(--초록)} #맵 .조건.참 b{color:var(--초록)}
  #맵 .층칸.새{border-color:var(--금)}
  #맵 .층칸.보스{border-color:#d9534f}
  #맵 .층칸 b{color:var(--글);font-size:14px;min-width:46px}
  #맵 .층칸 i{color:#8d7c99;font-size:12px;font-style:normal;flex:1}
  #맵 .층칸 .표{color:var(--금);font-size:12px}
  /* 카드 창 — 덮개를 누르면 닫힌다(폰에서 손가락이 위까지 안 올라가게) */
  #덮개{position:fixed;inset:0;z-index:40;background:rgba(10,7,13,.78);
        display:flex;align-items:center;justify-content:center;padding:16px}
  #덮개 .카드{width:100%;max-width:380px;max-height:86vh;overflow-y:auto;
              background:var(--창);border:2px solid #4a3a55;padding:12px}
  #덮개 .머리{display:flex;gap:10px;align-items:center}
  #덮개 .칸이름{color:#6e5d78;font-size:12px;margin:10px 0 4px}
  #덮개 .줄자{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:9px;font-size:13px;color:#c9b9a0}
  #덮개 .줄자 b{color:var(--글);font-weight:400}
  #덮개 .기술,#덮개 .장비{display:flex;flex-wrap:wrap;gap:4px}
  #덮개 .줄{display:flex;gap:6px;margin-top:12px}
  #덮개 .줄 .btn{flex:1}
  /* 기술·특성을 누르면 그 자리에서 풀이가 열린다 (10-09 사장님) */
  #덮개 .귀띔{color:#55475e;font-size:11px}
  #덮개 .tag[data-풀이]{cursor:pointer}
  #덮개 .tag.펴짐{box-shadow:0 0 0 1px var(--금) inset}
  #덮개 .풀이{display:none;margin-top:8px;padding:8px 10px;font-size:12.5px;line-height:1.55;
              color:#cdbda6;background:var(--창속);border-left:3px solid var(--금)}
  #덮개 .풀이.on{display:block}
  #덮개 .풀이 b{color:var(--글);font-weight:400}

  /* ── 캐릭터 상세 — 작은 모달을 걷어내고 **화면 전체**를 쓴다 (10-10 사장님).
       대원이 열 명만 돼도 팝업 안에서는 장비·기술을 한눈에 못 본다. ── */
  .머리띠{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--창속);border-bottom:2px solid var(--테)}
  .머리띠 .뒤로{color:var(--금);font-size:13px;cursor:pointer;padding:2px 6px}
  .머리띠 .넘김{margin-left:auto;display:flex;gap:4px}
  .머리띠 .넘김 span{color:var(--글);background:var(--창);border:2px solid var(--테);
                     padding:2px 11px;font-size:14px;cursor:pointer;line-height:1.4}
  .머리띠 .넘김 span.꺼짐{opacity:.3;cursor:default}
  .큰머리{display:flex;gap:12px;padding:12px 11px;align-items:center}
  .큰머리 .얼굴{width:92px;height:92px;background-size:88px 88px}
  .큰이름{font-size:17px}
  .힘{margin-top:6px;font-size:12px;color:var(--흐림)}
  .힘 b{color:var(--금);font-weight:400;font-size:15px}
  /* 시안(10-10): 능력치는 한 줄, 그 아래 큰 액자 */
  .한줄자{padding:0 11px 8px;font-size:12.5px;color:#8d7c99}
  .한줄자 b{color:var(--글);font-weight:400}
  .액자{margin:0 11px 10px;height:168px;border:2px solid var(--테);position:relative;overflow:hidden;
        background:#17111f url(art/tower.png) center/auto 100% no-repeat}
  .액자::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(10,7,13,.45),rgba(10,7,13,.72))}
  .액자 .선것{position:absolute;left:50%;bottom:6px;transform:translateX(-50%);width:120px;height:140px;
              background-position:center bottom;background-size:auto 136px;background-repeat:no-repeat;
              image-rendering:pixelated;z-index:2}
  .넉줄{display:grid;grid-template-columns:1fr 1fr;gap:5px 14px;padding:0 11px 10px;font-size:13px;color:#c9b9a0}
  .넉줄 span{display:flex;justify-content:space-between;border-bottom:1px solid var(--창속);padding-bottom:3px}
  .넉줄 b{color:var(--글);font-weight:400}
  .서브탭{display:flex;gap:6px;margin:0 0 6px}
  .서브탭 span{flex:1;text-align:center;padding:6px;font-size:13px;color:#8d7c99;
               background:var(--창속);border:2px solid var(--테);cursor:pointer}
  .서브탭 span.on{color:var(--금);background:var(--창);border-color:var(--빛테)}
  .귀띔{color:#55475e;font-size:11px}
  .기술{display:flex;flex-wrap:wrap;gap:4px}
  .칸이름{color:#6e5d78;font-size:12px;margin:10px 0 4px}
  .풀이{display:none;margin-top:8px;padding:8px 10px;font-size:12.5px;line-height:1.55;
        color:#cdbda6;background:var(--창속);border-left:3px solid var(--금)}
  .풀이.on{display:block}
  .풀이 b{color:var(--글);font-weight:400}
  .tag.펴짐{box-shadow:0 0 0 1px var(--금) inset}
  .tag[data-풀이]{cursor:pointer}
  /* 장비 슬롯 — 글자 단추 대신 네모 칸. 비면 비었다고 보인다 */
  .슬롯줄{display:flex;gap:8px;padding:10px 11px}
  .슬롯{flex:1;min-height:92px;background:var(--창속);border:2px solid var(--테);position:relative;cursor:pointer;
        display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:4px}
  .슬롯 .칸이름2{font-size:10px;color:#55475e}
  .슬롯 .템이름{font-size:11px;color:var(--글);text-align:center;line-height:1.25}
  .슬롯 .템값{font-size:10px;color:#8fe08f;text-align:center;line-height:1.2}
  .슬롯.참{border-color:var(--빛테)}
  .슬롯 .비움{position:absolute;top:1px;right:5px;color:#ff8e7a;font-size:13px}
  /* 출전 슬롯 — 글자 체크박스 대신 초상화 칸 (10-10 사장님) */
  .출전줄{display:flex;gap:4px;flex-wrap:wrap}
  .출전줄 .자리{flex:1 1 calc(20% - 4px);min-width:56px;background:var(--창속);border:2px solid var(--테);
                padding:4px 2px;text-align:center;cursor:pointer;position:relative}
  .출전줄 .자리.참{border-color:var(--빛테)}
  .출전줄 .빈자리{cursor:default;display:flex;align-items:center;justify-content:center;min-height:68px}
  .출전줄 .빈자리 i{color:#44384d;font-size:10px;font-style:normal}
  .출전줄 .낯{width:36px;height:36px;margin:0 auto 3px;border:2px solid;image-rendering:pixelated;
              background:#1a1420 center/34px 34px no-repeat}
  .출전줄 b{display:block;font-size:10.5px;color:var(--글);font-weight:400;line-height:1.2}
  .출전줄 i{display:block;font-size:9.5px;color:var(--흐림);font-style:normal}
  /* 10-10 사장님 "O/X 를 싹 없애라" — 체크 글자 대신 **불이 들어오는 카드**로 가른다 */
  .출전줄 .자리.켬{border-color:var(--금);background:#2a2033}
  .출전줄 .자리.켬 i{color:var(--금)}
  .출전줄.고르기 .자리{opacity:.6}
  .출전줄.고르기 .자리.켬{opacity:1}
  .출전줄 .넓게{flex:1 1 100%;display:flex;align-items:center;gap:10px;text-align:left;padding:8px 10px}
  .출전줄 .넓게 b{font-size:13px} .출전줄 .넓게 i{margin-left:auto;font-size:11px}
  /* ── 전투 진입 — 사장님 시안(10-10): 세로 슬롯 카드 · 전투 준비 두 칸 ── */
  .슬롯판{display:flex;gap:4px}
  .칸슬롯{flex:1;min-height:104px;background:var(--창속);border:2px solid var(--테);position:relative;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 2px;cursor:pointer}
  .칸슬롯.참{border-color:var(--금);background:#241c2e}
  .칸슬롯 .번호{position:absolute;top:1px;left:4px;font-size:9px;color:#55475e}
  .칸슬롯 .큰낯{width:40px;height:40px;border:2px solid;image-rendering:pixelated;
                background:#1a1420 center/38px 38px no-repeat}
  .칸슬롯 .더하기{width:40px;height:40px;line-height:36px;text-align:center;font-size:22px;
                  color:#44384d;border:2px dashed #3a2c45}
  .칸슬롯 b{font-size:9.5px;color:var(--글);font-weight:400;text-align:center;line-height:1.2}
  .칸슬롯 i{font-size:9px;color:#55475e;font-style:normal}
  .칸슬롯 i.참{color:var(--금)}
  .준비줄{display:flex;gap:6px;margin-top:4px}
  .준비칸{flex:1;background:var(--창속);border:2px solid var(--테);padding:6px 8px}
  .준비칸.흐림{opacity:.5}
  .준비머리{font-size:11px;color:var(--금);margin-bottom:5px}
  .준비머리 img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:3px}
  .준비속{display:flex;flex-direction:column;gap:5px}
  .준비속 b{font-size:11px;color:var(--글);font-weight:400}
  .준비속 i{font-size:11px;color:#55475e;font-style:normal}
  .큰단추{font-size:15px;padding:11px}
  /* 몇 병 챙길지 — 켜고 끄기가 아니라 수를 고른다 (10-10 사장님) */
  .수조절{display:flex;align-items:center;gap:8px;margin-left:10px}
  .수조절 span{width:26px;height:26px;line-height:22px;text-align:center;font-size:16px;cursor:pointer;
               background:var(--창);border:2px solid var(--테);color:var(--금)}
  .수조절 .몇{min-width:20px;text-align:center;color:var(--글);font-size:15px}
  /* 자격 — 됐는지 안 됐는지를 글자(✓·) 가 아니라 **색과 선**으로 */
  .자격칸{display:flex;flex-direction:column;gap:4px;margin-top:2px}
  .조건줄{display:flex;justify-content:space-between;font-size:12px;color:#6e5d78;
          padding:5px 8px;background:var(--창속);border-left:3px solid #3a2c45}
  .조건줄 b{color:#a8977f;font-weight:400}
  .조건줄.참{color:var(--초록);border-left-color:var(--초록)}
  .조건줄.참 b{color:var(--초록)}
  /* 가방 — **아래로 펼쳐지는 패널**. 위의 슬롯과 한 화면에 있어야 견주며 고른다 (10-10 사장님) */
  .가방패널{margin:0 11px 10px;background:var(--창속);border:2px solid var(--빛테)}
  .가방머리{display:flex;justify-content:space-between;padding:6px 10px;font-size:12px;color:var(--금);
            border-bottom:2px solid var(--테)}
  .가방머리 span{color:var(--흐림)}
  .가방패널 .가방격자{padding:8px}
  /* 가방 — 그리드 칸. 만든 것이 몇 개인지 한눈에 보여야 한다 */
  .가방격자{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:10px 11px}
  .칸짜리{min-height:76px;background:var(--창속);border:2px solid var(--테);cursor:pointer;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:3px}
  .칸짜리 .이름{font-size:10.5px;color:var(--글);text-align:center;line-height:1.2}
  .칸짜리 .수{font-size:10px;color:var(--금)}
  .칸짜리.낌{border-color:var(--빛테)}
  .칸짜리.빔{opacity:.35;cursor:default}
  /* 탭에 아이콘 (10-10 사장님 시안) — 그림 위, 글자 아래 */
  .tab img{display:block;width:26px;height:26px;margin:0 auto 1px;image-rendering:pixelated}
  .tab{line-height:1.1}
  /* 서브탭에도 아이콘 */
  .서브탭 span img{width:16px;height:16px;image-rendering:pixelated;vertical-align:-3px;margin-right:3px}
  /* 아이콘 칸 — 재료·장비를 글자가 아니라 **그림**으로 (사장님 시안) */
  .칸짜리 img{width:34px;height:34px;image-rendering:pixelated;display:block;margin:0 auto 2px}
  .슬롯 img{width:36px;height:36px;image-rendering:pixelated;display:block;margin:0 auto 2px}
  .재료칸 img{width:14px;height:14px;image-rendering:pixelated;vertical-align:-2px;margin-right:2px}
  .템아이콘{flex:none;width:40px;height:40px;background:var(--창속);border:2px solid var(--테);
            display:flex;align-items:center;justify-content:center}
  .템아이콘 img{width:32px;height:32px;image-rendering:pixelated}
  #log b{font-weight:400;color:#ffe2a8}

  #panel{height:0;overflow:hidden;background:var(--창);margin:0 4px}
  #panel.open{flex:1;height:auto;overflow-y:auto}   /* 공방·캐릭터 탭은 이 창이 화면을 채운다 — 260px 고정이면 탭 단추가 가운데 뜬다(10-07) */
  .row{display:flex;align-items:center;gap:9px;padding:9px 11px;border-bottom:2px solid var(--창속)}
  .row.된다{background:#241c2e;box-shadow:inset 3px 0 0 var(--금)}   /* 지금 만들 수 있는 것 (10-10 사장님) */
  .row.잠김{opacity:.5}
  /* 갈래 카드 — 대장간·시장이 먼저 두 갈래로 갈린다 (10-10 사장님 시안 2차) */
  .갈래머리{text-align:center;padding:10px 0 2px;font-size:15px;color:var(--글)}
  .갈래머리 span{color:var(--흐림);font-size:12px}
  .갈래밑{text-align:center;margin:6px 11px 12px;padding:6px;font-size:12px;color:#8d7c99;
          background:var(--창속);border:2px solid var(--테)}
  .갈래줄{display:flex;gap:10px;padding:0 11px}
  .갈래칸{flex:1;background:var(--창속);border:3px solid #3a2c45;position:relative;
          padding:12px 8px 10px;text-align:center}
  .갈래칸.열림{border-color:var(--초록);background:#1e2a1e;cursor:pointer;
               box-shadow:0 0 0 1px var(--초록) inset}
  .갈래칸.잠김{opacity:.6}
  .갈래번호{position:absolute;top:-11px;left:50%;transform:translateX(-50%);
            width:22px;height:22px;line-height:18px;font-size:11px;border-radius:50%;
            border:2px solid #3a2c45;background:var(--창);color:#8d7c99}
  .갈래칸.열림 .갈래번호{border-color:var(--금);background:#2a2033;color:var(--금)}
  .갈래그림{height:92px;display:flex;align-items:center;justify-content:center}
  .갈래그림 img{width:88px;height:88px;image-rendering:pixelated}
  .갈래이름{margin-top:6px;padding:5px;font-size:13px;color:var(--글);background:var(--창);border:2px solid var(--테)}
  .갈래칸.열림 .갈래이름{color:var(--초록);border-color:var(--초록)}
  .갈래줄.쪽글{margin-top:6px}
  .갈래쪽{flex:1;text-align:center;font-size:11px;color:#6e5d78;padding:4px;border:1px solid #3a2c45}
  .갈래쪽.열림{color:var(--금);border-color:#4a3a55}
  /* 대장간 — 층대로 묶고 재료를 칸으로 (10-09 "디테일하게 처음부터 다시") */
  .단계줄{padding:7px 11px 4px;font-size:11px;color:#6e5d78;background:var(--창속);letter-spacing:.5px}
  .재료줄{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .재료칸{font-size:11px;color:#8d7c99;border:1px solid #3a2c45;padding:2px 6px;background:var(--창속)}
  .재료칸 b{color:#ff8e7a;font-weight:400}
  .재료칸.참 b{color:var(--초록)}
  .재료칸 i{color:#ff8e7a;font-style:normal;margin-left:4px;font-size:10px}
  .row .nm{flex:1;min-width:0}
  .row .nm b{display:block;font-size:14px;color:var(--글);font-weight:400}
  .row .nm i{font-style:normal;font-size:12px;color:var(--흐림)}
  .tag{display:inline-block;font-size:11px;padding:1px 6px;background:var(--창속);color:var(--흐림);margin-right:3px;
       border-width:2px;box-shadow:none}
  .tag.r{color:var(--금)}
  .btn{padding:6px 11px;background:#4a3550;color:var(--글);font-size:13px;font-family:inherit;text-shadow:1px 1px 0 #000}
  .btn:active{box-shadow:inset -2px -2px 0 var(--빛테),inset 2px 2px 0 var(--그늘)}
  .btn:disabled{opacity:.4}
  /* 얼굴 칸 (10-07 사장님 "캐릭터창에 얼굴도") — 스프라이트 머리를 잘라 2배, 테두리는 등급색 */
  .얼굴{width:68px;height:68px;flex:none;image-rendering:pixelated;border:3px solid;background:#1a1420 center/64px 64px no-repeat;
        box-shadow:inset 0 0 0 1px #0d0910}
  .bar{height:6px;background:var(--테);margin-top:4px;padding:1px}
  .bar i{display:block;height:100%;background:var(--금)}

  /* ── 길드 (야영지) ── */
  #hall{flex:1;position:relative;display:none;background:var(--밤)}
  #hall.on{display:block}
  #hallArt{position:absolute;inset:0}
  #hallArt canvas{width:100%;height:100%}
  #side{position:absolute;top:10px;right:10px;display:flex;flex-direction:column;gap:6px}
  .rbtn{position:relative;padding:6px 10px;background:var(--창);font-size:12px;color:var(--글);text-shadow:1px 1px 0 #000;
        display:flex;align-items:center;gap:5px;min-width:94px}
  .rbtn img{width:18px;height:18px;image-rendering:pixelated}
  /* 소식 / 거점 — 시안처럼 묶음에 제목을 단다 (10-10) */
  .곁제목{font-size:10px;color:#8d7c99;text-shadow:1px 1px 0 #000;margin:2px 0 -2px;text-align:right}
  .rbtn .dot{position:absolute;top:4px;right:4px;width:6px;height:6px;background:#8fff6a;box-shadow:0 0 0 1px var(--테)}
  #bond{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(44,34,54,.94);padding:9px 12px}
  #bond .nm{display:flex;justify-content:space-between;align-items:baseline;text-shadow:1px 1px 0 #000}
  #bond .nm b{font-size:17px;font-weight:400;color:var(--금)}
  #bond .nm i{font-style:normal;font-size:11px;color:var(--흐림)}
  #bond .bar{height:8px;margin:6px 0 5px}
  #bond .sub{font-size:12px;color:var(--글)}

  #battle{flex:1;display:none;flex-direction:column;overflow:hidden}
  #battle.on{display:flex}
  #log{flex:1}

  #tabs{display:flex;gap:3px;padding:4px;background:var(--밤)}
  .tab{flex:1;padding:9px 0 10px;text-align:center;font-size:13px;color:var(--흐림);background:var(--창속)}
  .tab.on{color:var(--금);background:#4a3550;text-shadow:1px 1px 0 #000}
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <span class="zone" id="zone"></span>
    <span class="res"><span><img src="art/coin.png">&nbsp;<b id="gold">0</b></span>
                      <span><img src="art/shard.png">&nbsp;<b id="shard">0</b></span>
                      <button id="가방단추" type="button" aria-label="가방" data-말="bag">가방</button>
                      <button id="sndBtn" type="button" aria-label="소리">♪</button></span>
  </div>

  <!-- 길드: 켜면 여기. 대표 캐릭터 하나가 서 있고 우편함·공지·설정·친밀도가 붙는다. -->
  <div id="hall">
    <div id="hallArt"><canvas id="hcv"></canvas></div>
    <!-- 10-10 사장님 시안: 소식(우편·공지)은 위, 거점 살림(출석·식당·설정)은 아래 -->
    <div id="side">
      <div class="곁제목" data-말="side.news">커뮤니티 및 소식</div>
      <div class="rbtn" id="mailBtn"><img src="art/icon/s-scroll.png" alt=""><span data-말="side.mail">우편함</span><span class="dot"></span></div>
      <div class="rbtn" id="공지단추"><img src="art/icon/s-skill.png" alt=""><span data-말="side.notice">공지</span></div>
      <div class="곁제목" data-말="side.base">거점</div>
      <div class="rbtn" id="소환단추"><img src="art/icon/s-skill.png" alt=""><span data-말="side.summon">소환</span></div>
      <div class="rbtn" id="출석단추"><img src="art/icon/t-hall.png" alt=""><span data-말="side.attend">출석</span><span class="dot"></span></div>
      <div class="rbtn" id="식당단추"><img src="art/icon/s-grow.png" alt=""><span data-말="side.mess">식당</span></div>
      <div class="rbtn" id="설정단추"><img src="art/icon/t-forge.png" alt=""><span data-말="side.settings">설정</span></div>
    </div>
    <div id="bond">
      <div class="nm"><b id="repName">리안</b><i id="repAge">출전 0 / 1000 · 젊음</i></div>
      <div class="bar"><i id="bondBar" style="width:0%"></i></div>
      <div class="sub" id="repRole">공격 · 거구 축복</div>
    </div>
  </div>

  <div id="battle">
    <div id="board"><canvas id="cv"></canvas><button id="자격버튼" type="button"></button><button id="자동버튼" type="button">자동 등반</button><button id="탑버튼" type="button" data-말="board.tower">▲ 탑</button></div>
    <!-- 10-09 사장님: 시작하자마자 깨지 말고 **고르고 시작**한다. 멈춰 있을 때만 뜬다. -->
    <div id="맵"></div>
    <div id="log"></div>
  </div>
  <div id="panel"></div>

  <div id="tabs">
    <!-- 10-09 사장님 순서: 길드 · 캐릭터 · 전투 · 대장간 · 시장 (10-07 순서에서 바뀜) -->
    <div class="tab home on" data-t="hall"><img src="art/icon/t-hall.png" alt=""><span data-말="tab.hall">길드</span></div>
    <div class="tab" data-t="crew"><img src="art/icon/t-crew.png" alt=""><span data-말="tab.crew">캐릭터</span></div>
    <div class="tab" data-t="run"><img src="art/icon/t-run.png" alt=""><span data-말="tab.run">전투</span></div>
    <div class="tab" data-t="forge"><img src="art/icon/t-forge.png" alt=""><span data-말="tab.forge">대장간</span></div>
    <div class="tab" data-t="shop"><img src="art/icon/t-shop.png" alt=""><span data-말="tab.shop">시장</span></div>
  </div>
</div>

<script>
/*
 * 10-17 사장님 "꼭 누르면 이미지 나오는 거 고쳐".
 * 폰에서 전투 화면을 꾹 누르면 안드로이드가 **그림 메뉴**를 띄웠다 — 게임 위에 덮여서
 * 다음 턴이 안 보인다. CSS 의 touch-callout 과 **이 한 줄**이 같이 있어야 막힌다
 * (WebView 는 contextmenu 를 막아야 긴 누름 메뉴를 안 띄운다).
 * 글자 입력칸이 없는 창이라 잃는 것이 없다.
 */
document.addEventListener("contextmenu", (e) => e.preventDefault());

/* ──────────────────────────────────────────────────────────────
 * **말 표** (10-19 사장님 "모든 앱 전세계화").
 *
 * 이 창의 한국어는 화면에 나가는 것만 **834 개 · 16,286 자**다. 한 번에 손대면 게임이 통째로
 * 깨진다 — 그래서 **첫 화면부터** 한 겹씩 옮긴다. 옮긴 자리는 `data-말="키"` 가 붙고,
 * 안 옮긴 자리는 한국어 그대로 남는다(섞여 있어도 게임은 돈다).
 *
 * **못 옮기는 것이 있다, 정직하게**: 전투 글은 `조사(이름,"은","는")` 처럼 한국어 문법이
 * 박혀 있어 말만 바꿔선 안 된다. 그건 문장 틀째로 갈아야 하고 이 판에서 안 한다.
 *
 * 기본 말은 **브라우저가 한국어면 한국어, 아니면 영어**다 — 178 개국에 나가는데
 * 기본이 한국어면 읽을 사람이 한국 사람뿐이다.
 */
const 말표 = {
  "tab.hall": { ko: "길드", en: "Guild" },
  "tab.crew": { ko: "캐릭터", en: "Heroes" },
  "tab.run": { ko: "전투", en: "Battle" },
  "tab.forge": { ko: "대장간", en: "Forge" },
  "tab.shop": { ko: "시장", en: "Market" },
  "side.news": { ko: "커뮤니티 및 소식", en: "News" },
  "side.mail": { ko: "우편함", en: "Mail" },
  "side.notice": { ko: "공지", en: "Notices" },
  "side.base": { ko: "거점", en: "Camp" },
  "side.summon": { ko: "소환", en: "Summon" },
  "side.attend": { ko: "출석", en: "Daily" },
  "side.mess": { ko: "식당", en: "Mess Hall" },
  "side.settings": { ko: "설정", en: "Settings" },
  "bag": { ko: "가방", en: "Bag" },
  "board.tower": { ko: "▲ 탑", en: "▲ Tower" },
  /* 실행 중에 글자가 바뀌는 자리 — `data-말` 이 안 먹어서 코드에서 부른다 */
  "board.qual": { ko: "{n}층 자격", en: "Floor {n} entry" },
  "board.qualOk": { ko: "{n}층 자격 · 참", en: "Floor {n} entry · ready" },
  "board.autoOn": { ko: "자동 등반 켬", en: "Auto climb ON" },
  "board.autoOff": { ko: "자동 등반 끔", en: "Auto climb OFF" },
  "set.lang": { ko: "언어 / Language", en: "Language / 언어" },
  /* ── 둘째 겹 (10-20): **늘 보이는 줄**부터. 탭마다 25~44자인데 그 절반이 이 윗줄이었다. */
  "top.floor": { ko: "{n}층", en: "Floor {n}" },
  "top.pack": { ko: "무리 {i}/{n}", en: "Pack {i}/{n}" },
  "top.grind": { ko: "되돌이", en: "Grinding" },
  "stat.hp": { ko: "체력", en: "HP" },
  "stat.atk": { ko: "공격", en: "ATK" },
  "stat.def": { ko: "방어", en: "DEF" },
  "stat.spd": { ko: "속도", en: "SPD" },
  /* 구간 이름 — 윗줄에 늘 떠 있다. 분위기가 반이라 뜻을 옮기되 결을 지킨다. */
  "zone.1": { ko: "침묵의 배수 회랑", en: "Silent Drain Corridor" },
  "zone.2": { ko: "쇠종의 회랑", en: "Hall of Iron Bells" },
  "zone.3": { ko: "물잠긴 암거", en: "Flooded Culvert" },
  "zone.4": { ko: "재의 숙영지", en: "Camp of Ash" },
  "zone.5": { ko: "봉인된 현자의 전당", en: "Sealed Sage's Hall" },

  "fight.fireball": { ko: "<b>{name}</b>의 화염구 → {foe} <span class=\"hit\">{dmg}</span>", en: "<b>{name}</b>'s fireball → {foe} <span class=\"hit\">{dmg}</span>" },
  "fight.holyFire": { ko: "<b>{name}</b>의 성화 → {foe} <span class=\"hit\">{dmg}</span>", en: "<b>{name}</b>'s holy flame → {foe} <span class=\"hit\">{dmg}</span>" },
  "fight.holyBless": { ko: "<b>{name}</b>{이가} 성스러운 축복을 내렸다. <span class=\"good\">아군 전원 공격 +20% · 3턴</span>", en: "<b>{name}</b> grants a holy blessing. <span class=\"good\">All allies ATK +20% · 3 turns</span>" },
  "fight.lightWard": { ko: "<b>{name}</b>{이가} 빛의 수호막을 펼쳤다. <span class=\"good\">아군 전원 막</span>", en: "<b>{name}</b> spreads a ward of light. <span class=\"good\">Barrier on all allies</span>" },
  "fight.tempestCut": { ko: "<b>{name}</b>{이가} 관통 폭풍 참을 휘둘렀다.", en: "<b>{name}</b> swings a piercing tempest cut." },
  "fight.bloodBless": { ko: "<b>{name}</b>{이가} 혈의 축복을 내렸다. <span class=\"bad\">체력 10%</span> → <span class=\"good\">아군 전원 공격 +40% · 3턴</span>", en: "<b>{name}</b> grants a blessing of blood. <span class=\"bad\">10% HP</span> → <span class=\"good\">All allies ATK +40% · 3 turns</span>" },
  "fight.soulFlip": { ko: "<b>{name}</b>{이가} 영혼을 뒤집었다. {foe}의 보호막 <b>{n}</b>이 아군에게 넘어온다.", en: "<b>{name}</b> inverts the soul. {foe}'s barrier <b>{n}</b> passes to the allies." },
  "fight.allyTookBarrier": { ko: "아군 전원이 그 막을 둘렀다.", en: "Every ally takes up that barrier." },
  "fight.shieldBash": { ko: "<b>{name}</b>{이가} 방패로 들이받았다. → {foe} <span class=\"hit\">{dmg}</span>", en: "<b>{name}</b> rams with the shield. → {foe} <span class=\"hit\">{dmg}</span>" },
  "fight.atkDown": { ko: " <span class=\"good\">· 공격 −10% (2턴)</span>", en: " <span class=\"good\">· ATK −10% (2 turns)</span>" },
  "fight.sanctuary": { ko: "<b>{name}</b>{이가} 성역의 진형을 세웠다. <span class=\"good\">아군 전원 방어 +35% · 받는 피해 −15% · 3턴</span>", en: "<b>{name}</b> sets the formation of sanctuary. <span class=\"good\">All allies DEF +35% · damage taken −15% · 3 turns</span>" },
  "fight.vitalStrike": { ko: "<b>{name}</b>{이가} 급소를 베었다. → {foe} <span class=\"hit\">{dmg}</span>", en: "<b>{name}</b> cuts a vital spot. → {foe} <span class=\"hit\">{dmg}</span>" },
  "fight.shadowAmbush": { ko: "<b>{name}</b>{이가} 그림자에서 덮쳤다. → {foe} <span class=\"hit\">{dmg}</span> <span class=\"bad\">· 출혈 3턴</span>", en: "<b>{name}</b> strikes from the shadows. → {foe} <span class=\"hit\">{dmg}</span> <span class=\"bad\">· bleed 3 turns</span>" },
  "fight.decayCurse": { ko: "<b>{name}</b>{이가} 부패의 저주를 뿌렸다. <span class=\"bad\">적 전원 3턴 지속 피해 · 방어 15% 감소</span>", en: "<b>{name}</b> casts the curse of decay. <span class=\"bad\">All foes take damage for 3 turns · DEF −15%</span>" },
  "fight.chainsBreak": { ko: "<b>{name}</b>{이가} 사슬을 던져 보호막을 끊었다.", en: "<b>{name}</b> throws chains and severs the barrier." },
  "fight.bleedOpen": { ko: "{foe}의 상처가 벌어졌다. <span class=\"hit\">{dmg}</span>", en: "{foe}'s wound tears open. <span class=\"hit\">{dmg}</span>" },
  "fight.decayGnaw": { ko: "{foe}{이가} 부패에 갉아먹혔다. <span class=\"hit\">{dmg}</span>", en: "{foe} is gnawed by decay. <span class=\"hit\">{dmg}</span>" },
  "fight.bossSlam": { ko: "<b>{foe}</b>{이가} 바닥을 내리찍었다 — <span class=\"big\">전원</span>", en: "<b>{foe}</b> slams the ground — <span class=\"big\">everyone</span>" },
  "fight.hitAlly": { ko: "→ <b>{who}</b> <span class=\"bad\">{dmg}</span>", en: "→ <b>{who}</b> <span class=\"bad\">{dmg}</span>" },
  "fight.hitAllyBlocked": { ko: "→ <b>{who}</b> <span class=\"bad\">{dmg}</span> (막 {blocked})", en: "→ <b>{who}</b> <span class=\"bad\">{dmg}</span> (barrier {blocked})" },
  "fight.stoodBackUp": { ko: "<b>{who}</b>{이가} 쓰러지려다 <span class=\"good\">다시 섰다</span>. (체력 {n})", en: "<b>{who}</b> nearly falls but <span class=\"good\">stands again</span>. (HP {n})" },
  "fight.didNotKneel": { ko: "<b>{who}</b>{이가} 무릎을 꿇지 않았다 — 막 <span class=\"good\">{n}</span>", en: "<b>{who}</b> refuses to kneel — barrier <span class=\"good\">{n}</span>" },
  "fight.collapsed": { ko: "<b>{who}</b>{이가} 주저앉았다.", en: "<b>{who}</b> slumps down." },
  "fight.knightGuards": { ko: "<b>기사</b>가 {who} 앞에 방패를 들었다. 막 <span class=\"good\">{n}</span>", en: "The <b>Knight</b> raises a shield before {who}. Barrier <span class=\"good\">{n}</span>" },
  "fight.foeBlocked": { ko: "{foe} → <b>{who}</b> 막이 <span class=\"good\">{blocked}</span> 받아냈다", en: "{foe} → <b>{who}</b> the barrier absorbed <span class=\"good\">{blocked}</span>" },

  /* ── 기술·특성 설명글 (10-24 전세계화 3판) ── */
  "desc.푸른방패검": { ko: "일반공격 · 적 하나를 공격력 <b>95%</b>로 친다. 그 뒤 나에게 막을 두른다 — 최대체력 4% + 공격력 35%.", en: "Basic · Hits one foe for <b>95%</b> ATK, then wraps a barrier on self — 4% max HP + 35% ATK." },
  "desc.철벽의맹세": { ko: "기술 · <b>{turns}턴</b>마다. 아군 전원에게 막 <b>공격력 {pct}%</b>를 씌우고, 적의 눈이 나에게 쏠린다(도발).", en: "Skill · Every <b>{turns} turns</b>. Barriers all allies for <b>{pct}% ATK</b> and pulls every foe's eye onto me (taunt)." },
  "desc.새벽을가르는방패": { ko: "궁극기 · 적 전원을 <b>공격력 {pct}%</b>로 친다. 보호막을 두른 적은 피해 대신 <b>보호막 25</b>가 깎인다. 그 뒤 아군 전원에게 막 공격력 220%.", en: "Ultimate · Hits all foes for <b>{pct}% ATK</b>. A barriered foe loses <b>25 barrier</b> instead of taking damage. Then barriers all allies for 220% ATK." },
  "desc.새벽을가르는방패.6": { ko: " 이 막은 <b>닳지 않는다</b>.", en: " That barrier <b>does not wear down</b>." },
  "desc.연속베기": { ko: "일반공격 · 적 하나를 <b>두 번</b> 벤다(각 공격력 62%). 한 대마다 <b>12%</b>로 치명타(2배). 몰아 때리는 것보다 <b>막을 긁어내기</b> 좋다.", en: "Basic · Cuts one foe <b>twice</b> (62% ATK each). Each hit crits at <b>12%</b> (2x). Better at <b>scraping barriers off</b> than one heavy blow." },
  "desc.약점노리기": { ko: "기술 · <b>3턴</b>마다. 다음 공격이 <b>반드시 치명타</b>가 되고 적 <b>방어 40%를 무시</b>한다.", en: "Skill · Every <b>3 turns</b>. The next attack is a <b>guaranteed crit</b> and <b>ignores 40% DEF</b>." },
  "desc.처형": { ko: "기술 · <b>4턴</b>마다. 적의 남은 체력이 <b>절반 아래</b>일 때만 쓴다. 적이 다칠수록 세진다 — 반피에 <b>2.1배</b>, 10% 남으면 <b>3.2배</b>.", en: "Skill · Every <b>4 turns</b>. Used only when the foe is <b>below half HP</b>. The more hurt they are, the harder it lands — <b>2.1x</b> at half, <b>3.2x</b> at 10% left." },
  "desc.치유의빛": { ko: "일반공격 · 가장 많이 다친 아군을 <b>공격력 90%</b>만큼 회복한다.", en: "Basic · Heals the most wounded ally for <b>90% ATK</b>." },
  "desc.구원의진형": { ko: "기술 · <b>3턴</b>마다. 아군 <b>전원</b>을 공격력 50%만큼 회복한다. 보스가 3턴마다 전원을 치는 것에 맞서는 자리다.", en: "Skill · Every <b>3 turns</b>. Heals <b>all</b> allies for 50% ATK. This is the answer to a boss sweeping the party every third turn." },
  "desc.화염구": { ko: "일반공격 · 적 하나를 <b>공격력 125%</b>로 친다. 마법이라 적 <b>방어 20%를 무시</b>한다.", en: "Basic · Hits one foe for <b>125% ATK</b>. Being magic, it <b>ignores 20% DEF</b>." },
  "desc.부패의저주": { ko: "기술 · <b>4턴</b>마다. 적 <b>전원</b>에게 3턴 동안 매 턴 공격력 35%의 피해를 주고, 그동안 <b>방어를 15% 깎는다</b>.", en: "Skill · Every <b>4 turns</b>. Deals 35% ATK to <b>all</b> foes each turn for 3 turns and <b>shaves 15% DEF</b> while it lasts." },
  "desc.사슬": { ko: "기술 · <b>3턴</b>마다. 보호막을 두른 적 하나의 보호막을 <b>통째로</b> 없앤다.", en: "Skill · Every <b>3 turns</b>. Strips one barriered foe's barrier <b>entirely</b>." },
  "desc.방패치기": { ko: "일반공격 · 적 하나를 공격력 <b>100%</b>로 들이받는다. <b>20%</b>로 그 적의 공격력이 <b>10% 떨어진다</b>(2턴).", en: "Basic · Rams one foe for <b>100%</b> ATK. <b>20%</b> chance to drop that foe's ATK by <b>10%</b> (2 turns)." },
  "desc.성역의진형": { ko: "기술 · <b>4턴</b>마다. <b>3턴</b> 동안 아군 전원 방어 <b>+35%</b>, 받는 피해 <b>−15%</b>. 둘은 따로 먹는다.", en: "Skill · Every <b>4 turns</b>. For <b>3 turns</b>, all allies gain <b>+35%</b> DEF and take <b>−15%</b> damage. The two stack separately." },
  "desc.급소베기": { ko: "일반공격 · 적 하나를 공격력 <b>100%</b>로 베고 그 적의 <b>방어 20%를 무시</b>한다. <b>12%</b>로 치명타(2배) — 출혈 중인 적에겐 <b>27%</b>.", en: "Basic · Cuts one foe for <b>100%</b> ATK and <b>ignores 20% DEF</b>. Crits at <b>12%</b> (2x) — <b>27%</b> against a bleeding foe." },
  "desc.관통폭풍참": { ko: "일반공격 · <b>적 전원</b>을 공격력 <b>78%</b>로 베고 <b>방어 20%를 무시</b>한다. <i>(폭풍의 영혼석)</i>", en: "Basic · Cuts <b>all foes</b> for <b>78%</b> ATK and <b>ignores 20% DEF</b>. <i>(Soulstone of the Tempest)</i>" },
  "desc.혈의축복": { ko: "기술 · <b>4턴</b>마다. 아군 전원 체력을 <b>10%</b> 태우고 <b>3턴</b> 동안 공격 <b>+40%</b>. 이걸로는 쓰러지지 않는다. <i>(혈의 영혼석)</i>", en: "Skill · Every <b>4 turns</b>. Burns <b>10%</b> of every ally's HP for <b>+40%</b> ATK over <b>3 turns</b>. It cannot drop anyone. <i>(Soulstone of Blood)</i>" },
  "desc.영혼반전": { ko: "기술 · <b>3턴</b>마다. 적 하나의 보호막을 통째로 끊고, <b>그만큼을 아군 전원의 막</b>으로 돌린다. <i>(역천의 영혼석)</i>", en: "Skill · Every <b>3 turns</b>. Severs one foe's whole barrier and turns <b>that much into a barrier for every ally</b>. <i>(Soulstone of Defiance)</i>" },
  "desc.그림자습격": { ko: "기술 · <b>4턴</b>마다. 적 하나를 공격력 <b>160%</b>·방어 20% 무시로 치고 <b>3턴 출혈</b>을 남긴다(턴마다 공격력 40%). 출혈은 칼리드의 저주와 <b>따로</b> 쌓인다.", en: "Skill · Every <b>4 turns</b>. Hits one foe for <b>160%</b> ATK ignoring 20% DEF and leaves <b>3 turns of bleed</b> (40% ATK per turn). Bleed stacks <b>separately</b> from Kalid's curse." },
  "desc.기도": { ko: "일반공격 · 다친 아군이 있으면 <b>공격력 55%</b>만큼 덮고, 아무도 안 다쳤으면 적을 공격력 80%로 친다.", en: "Basic · Mends a wounded ally for <b>55% ATK</b>; if nobody is hurt, hits a foe for 80% ATK instead." },
  "desc.성스러운축복": { ko: "기술 · <b>4턴</b>마다. 아군 <b>전원</b>의 공격을 <b>3턴 동안 +20%</b>. 내 공격이 약한 대신 넷을 함께 키운다.", en: "Skill · Every <b>4 turns</b>. Raises <b>every</b> ally's ATK by <b>+20% for 3 turns</b>. My own blows are weak; I lift all four instead." },
  "desc.빛의수호막": { ko: "기술 · <b>3턴</b>마다. 아군 전원에게 <b>각자 최대체력의 14%</b>만큼 막. 공격력이 아니라 <b>받는 쪽의 몸집</b>을 따르므로 탱커가 더 두꺼워진다.", en: "Skill · Every <b>3 turns</b>. Barriers every ally for <b>14% of their own max HP</b>. It follows <b>the receiver's size</b>, not my ATK, so the tank gets the thickest shell." },
  "desc.마지막 수호자": { ko: "가장 위태로운 아군이 맞기 직전, 내가 대신 막을 씌운다 — <b>내 최대체력의 {pct}%</b>. 한 턴에 한 번, 나 자신에게는 안 걸린다. 궁 게이지도 <b>+34</b> 찬다.", en: "Just before the most endangered ally is struck, I throw a barrier over them instead — <b>{pct}% of my max HP</b>. Once per turn, never on myself. It also charges <b>+34</b> ultimate." },
  "desc.푸른 강철의 결의": { ko: "내가 막을 두르고 있는 동안 <b>받는 피해 {pct}% 감소</b>.", en: "While I hold a barrier, <b>damage taken is reduced {pct}%</b>." },
  "desc.결의": { ko: "체력이 떨어질수록 공격이 오른다 — 체력이 다 닳기 직전이면 <b>+45%</b>. 벼랑에서 더 세진다.", en: "The lower my HP, the harder I hit — <b>+45%</b> on the brink. Stronger at the cliff edge." },
  "desc.꺼지지 않는 등불": { ko: "전투가 이어지는 동안 쉬지 않고 가장 위태로운 아군을 찾는다. 기술 「구원의 진형」은 <b>누군가 20% 넘게 다쳤을 때만</b> 쓴다 — 아껴 두었다가 광역이 들어온 뒤에 편다.", en: "Through the whole fight I keep looking for whoever is closest to falling. I spend Formation of Salvation <b>only once someone is over 20% hurt</b> — held back for after a sweep lands." },
  "desc.손이 닿는 자리": { ko: "뒤에 서서 넷을 본다. 축복과 막은 <b>살아 있는 아군 전원</b>에게 간다 — 누가 앞에 섰든.", en: "I stand at the back and watch all four. Blessings and barriers reach <b>every living ally</b> — whoever is up front." },
  "desc.불굴의 의지": { ko: "체력이 <b>30% 아래로 떨어지는 그 순간</b>, 한 판에 딱 한 번 <b>최대체력의 25%</b>만큼 막을 두른다. 막 천장(35%)은 그대로 먹는다.", en: "<b>The moment HP falls under 30%</b>, once per battle, I wrap a barrier of <b>25% max HP</b>. The barrier cap (35%) still applies." },
  "desc.맹독 바르기": { ko: "<b>출혈 중인 적</b>을 칠 때 치명타 확률이 <b>+15%</b>(12% → 27%). 그래서 「그림자 습격」을 먼저 넣고 베는 것이 세다.", en: "Against a <b>bleeding foe</b>, crit chance is <b>+15%</b> (12% → 27%). So landing Shadow Ambush first and then cutting is the stronger line." },
  "desc.마른 심지": { ko: "불과 저주를 함께 쓴다. 「부패의 저주」가 깎아 둔 방어는 <b>내 화염구뿐 아니라 아군의 모든 공격</b>에 함께 먹는다.", en: "I wield fire and curse together. The DEF that Curse of Decay shaves off applies to <b>every ally's attack, not just my fireball</b>." },

 * (한 장을 100층 높이로 늘리면 도트가 깨진다).
 * 도는 중에는 안 뜬다 — 층 단추가 떠 있으면 누를 때마다 전투가 끊긴다.
 */
function 맵그리기(){
  const 칸 = $("#맵"); if (!칸) return;
  const 탑단추 = $("#탑버튼");
  if (탑단추) 탑단추.classList.toggle("on", S.진행 && S.탭 === "run");
  // 관문(10의 배수)에 **들어와 있을 때만** 뜬다 — 일반 층에선 볼 게 없다
  const 자격단추 = $("#자격버튼");
  if (자격단추) {
    const 문 = S.진행 && S.탭 === "run" && S.층 % 10 === 0;
    자격단추.classList.toggle("on", 문);
    if (문) { const 자 = 자격(S.층);
      자격단추.classList.toggle("참", 자.참);
      자격단추.textContent = 말(자.참 ? "board.qualOk" : "board.qual", { n: S.층 }); }
  }
  const 자동단추 = $("#자동버튼");
  if (자동단추) { 자동단추.classList.toggle("on", S.진행 && S.탭 === "run");
    자동단추.classList.toggle("켬", !!S.자동오름);
    자동단추.textContent = 말(S.자동오름 ? "board.autoOn" : "board.autoOff"); }
  // 10-09 사장님 "탑 고를 때 전투 화면이 왜 있냐고" — 멈춰 있는 동안 전투 칸을 접는다.
  // 싸우지도 않는 전투 화면이 위에 붙어 있으면 탑이 반쪽만 보이고, 고르는 중인지 싸우는 중인지도 헷갈린다.
  const 판 = $("#board"); if (판) 판.classList.toggle("접음", !S.진행 && S.탭 === "run");
  칸.classList.toggle("on", !S.진행);
  if (S.진행) return;
  // 열린 층까지 보인다. 10-09 부터 **자격**이 여는 것이라 S.최고층 = 열린층().
  const 끝 = Math.min(100, Math.max(1, S.최고층 || 1));
  const 층들 = Array.from({ length: 끝 }, (_, i) => 끝 - i);          // 위가 높은 층
  // 10-09 지피티로 뽑은 탑 그림(256×384 두 장). **도트 한 칸이 기계 픽셀 정수배**가 되게 폭을 정한다 —
  // 폭을 100% 로 맡기면 3.04배 같은 값이 나와 어떤 칸은 3px, 어떤 칸은 4px 이 돼 뭉개진다(전투 배경과 같은 규칙).
  const d = devicePixelRatio || 1, 바탕폭 = 256, 바탕높 = 384;
  const k = Math.max(1, Math.round((칸.clientWidth || 360) * d / 바탕폭));
  const 폭 = 바탕폭 * k / d, 꼭 = 바탕높 * k / d;
  // 꼭대기는 **끝까지 올랐을 때만** 보인다 — 13층에서 꼭대기가 보이면 다 오른 것처럼 보인다
  const 끝까지 = 끝 >= 100;
  칸.innerHTML = `<div class="속">
    <div class="탑" style="background-size:${폭}px auto;background-position:center ${끝까지 ? 꼭 : 0}px">
      ${끝까지 ? `<img class="꼭대기" src="art/tower-top.png" style="width:${폭}px" alt="">` : ""}</div>
    ${끝까지 ? "" : `<div class="안개"></div>`}
    <!-- 10-09 사장님 구성: 자격으로 열린다. **뭐가 남았는지 항상 보여야** 한다 —
         몇 달짜리 게임에서 "뭘 해야 하는지 모르겠다"는 바로 삭제다. -->
    <div class="층들">${층들.map((f) => {
      const 보스 = f % 10 === 0, 자 = 자격(f), 꼭대기층 = f === 끝;
      return `<div class="층칸${보스 ? " 보스" : ""}${자.참 ? "" : " 새"}" data-f="${f}">
        <div class="머리줄"><b>${말("top.floor", { n: f })}</b>
          <i>${보스 ? 말값(구간(f).보스.이름) : 말(`zone.${((f - 1) % 10) + 1}`)}</i>
          <span class="표">${말(자.참 ? "map.done" : 꼭대기층 ? "map.climbing" : "map.todo")}</span></div>
        <div class="자격줄">${자.줄.map((r) => `<span class="조건${r.됨 ? " 참" : ""}">${r.이름} <b>${r.지금}</b></span>`).join("")}</div>
      </div>`;
    }).join("")}</div></div>`;
  칸.querySelectorAll("[data-f]").forEach((b) => b.onclick = () => 출발창(Number(b.dataset.f)));
}

$("#가방단추").onclick = () => 가방창();

/* ── 길드 (10-10 사장님) ─────────────────────────────────────────
   우편함·공지·설정은 HTML 에만 있고 **눌러도 아무 일이 없었다**. 셋을 살리고
   출석·식당을 더했다. 별가루는 그동안 쌓이기만 했는데 여기서 쓸 데가 생긴다. */
function 쪽창(제목, 속, 꾸밈){
  const 덮 = document.createElement("div"); 덮.id = "덮개";
  덮.innerHTML = `<div class="카드" onclick="event.stopPropagation()">
    <div class="nm"><b>${제목}</b></div>${속}
    <div class="줄"><button class="btn" id="닫기">${말("ui.close")}</button></div></div>`;
  덮.onclick = () => 덮.remove();
  document.body.appendChild(덮);
  덮.querySelector("#닫기").onclick = () => 덮.remove();
  꾸밈?.(덮);
  return 덮;
}
const 오늘날 = () => new Date().toISOString().slice(0, 10);

$("#출석단추").onclick = () => {
  if (S.출석날 === 오늘날()) { 쪽창(말("ui.checkin"), `<div class="풀이 on">${말("guild.checkedIn")}</div>`); return; }
  S.출석날 = 오늘날();
  S.가방.별가루 += 50; S.금화 += 2000;
  윗줄(); 저장(); 길드그리기();
  쪽창("출석", `<div class="풀이 on">원정대 장부에 이름을 적었다.<br>
    <b style="color:var(--금)">별가루 +50</b> · <b style="color:var(--금)">금화 +2,000</b><br>
    지금 별가루 ${수(S.가방.별가루)}</div>`);
};

/** 식당 — 재료를 밥으로 바꾼다. 잔혼은 쌓이기만 하던 재료였다. */
const 식당값 = { 잔혼: 10, 금화: 3000 };
$("#식당단추").onclick = () => {
  const 됨 = S.가방.잔혼 >= 식당값.잔혼 && S.금화 >= 식당값.금화;
  const 남 = S.버프?.남은 ?? 0;
  쪽창("길드 식당", `<div class="풀이 on">
      ${남 > 0 ? 말("guild.mealNow", { pct: Math.round(S.버프.몫*100), n: 남 }) : ""}
      한 끼를 차리면 <b>다음 10판</b> 동안 파티 <b style="color:var(--초록)">공격 +5%</b>.<br>
      드는 것: 짐승 잔혼 <span style="color:${S.가방.잔혼 >= 식당값.잔혼 ? "#8fe08f" : "#ff8e7a"}">${S.가방.잔혼}/${식당값.잔혼}</span>
      · 금화 <span style="color:${S.금화 >= 식당값.금화 ? "#8fe08f" : "#ff8e7a"}">${수(식당값.금화)}</span>
    </div>
    <div class="줄"><button class="btn" id="차리기" ${됨 ? "" : "disabled"}>차리기</button></div>`,
    (덮) => { const b = 덮.querySelector("#차리기"); if (!b) return;
      b.onclick = () => {
        if (S.가방.잔혼 < 식당값.잔혼 || S.금화 < 식당값.금화) return;
        S.가방.잔혼 -= 식당값.잔혼; S.금화 -= 식당값.금화;
        S.버프 = { 남은: 10, 몫: .05 };
        윗줄(); 저장(); 덮.remove();
        적기(말("log.mealServed"), "good");
      }; });
};

$("#mailBtn").onclick = () => 쪽창("우편함",
  `<div class="풀이 on">${말("guild.noMail")}</div>`);

/* 10-20: **규칙은 여기에만 적혀 있다.** 영어로 열었는데 이 창이 한국어면 처음 온 사람은
   게임이 어떻게 굴러가는지 영영 모른다 — 그래서 둘째 겹에서 제일 먼저 옮겼다. */
$("#공지단추").onclick = () => 쪽창(말("side.notice"), `<div class="풀이 on">${말("notice.body")}</div>`);

$("#설정단추").onclick = () => 쪽창(말("side.settings"),
  `<div class="줄"><b>${말("set.lang")}</b></div>
   <div class="줄"><button class="btn" id="말ko">한국어</button><button class="btn" id="말en">English</button></div>
   <div class="풀이 on">${말("set.sound")}</div>
   <div class="줄"><button class="btn" id="의견단추">${말("set.feedback")}</button></div>
   <div class="줄"><button class="btn" id="지우기단추">${말("set.wipe")}</button></div>`,
  (덮) => {
    /* 10-19: 말을 바꾸면 **창을 닫는다** — 열린 창 안의 글자는 이미 그려진 것이라 안 바뀐다.
       반쯤 바뀐 창을 보여 주느니 닫고 새로 열게 하는 쪽이 덜 헷갈린다. */
    for (const [id, 값] of [["#말ko", "ko"], ["#말en", "en"]]) {
      const b = 덮.querySelector(id);
      if (!b) continue;
      if (쓰는말 === 값) b.classList.add("on");
      b.onclick = () => { 말바꾸기(값); 덮.remove(); };
    }
    /* 10-26: 의견 한 줄. **보내고 나면 창을 닫는다** — 보냈는지 모르면 또 보낸다. */
    덮.querySelector("#의견단추").onclick = () => {
      덮.remove();
      쪽창(말("fb.title"),
        `<div class="풀이 on">${말("fb.hint")}</div>
         <div class="줄"><textarea id="의견글" rows="4" style="width:100%;box-sizing:border-box"></textarea></div>
         <div class="줄"><button class="btn" id="의견보내기">${말("fb.send")}</button></div>
         <div class="풀이" id="의견말"></div>`,
        (덮3) => {
          const 글칸 = 덮3.querySelector("#의견글"), 말칸 = 덮3.querySelector("#의견말"), 단추 = 덮3.querySelector("#의견보내기");
          글칸.focus();
          단추.onclick = async () => {
            const 글 = (글칸.value || "").trim();
            if (!글) { 말칸.className = "풀이 on"; 말칸.textContent = 말("fb.empty"); return; }
            단추.disabled = true;
            try {
              const r = await fetch("/api/ash/feedback", {
                method: "POST", headers: { "content-type": "application/json" },
                body: JSON.stringify({ 글, 층: S.층, 최고층: S.최고층, 말: 쓰는말 }),
              });
              if (!r.ok) throw new Error(String(r.status));
              말칸.className = "풀이 on"; 말칸.textContent = 말("fb.thanks");
              setTimeout(() => 덮3.remove(), 1200);
            } catch {
              말칸.className = "풀이 on"; 말칸.textContent = 말("fb.failed");
              단추.disabled = false;
            }
          };
        });
    };
    덮.querySelector("#지우기단추").onclick = () => {
    덮.remove();
    // 한 번 더 묻는다 — 실수로 눌러서 몇 달치가 날아가면 돌이킬 수 없다
    쪽창("정말 지울까", `<div class="풀이 on">지금까지 깬 층과 모은 것이 <b>전부</b> 사라진다. 되돌릴 수 없다.</div>
      <div class="줄"><button class="btn" id="진짜">그래도 지운다</button></div>`,
      (덮2) => { 덮2.querySelector("#진짜").onclick = () => { 지우기(); location.reload(); }; });
  }; });

/* 전투를 멈추고 탑으로 — 되돌이도 여기서 끊는다. 이 길이 없어서 한번 떠나면 맵을 못 봤다. */

/**
 * **층을 누르면 — 누구를 데려갈까** (사장님 "층 누르면 출전 시킬 동료 구하고").
 * 출전을 여기서 고르고 떠난다. 되돌이로 돌지 한 층씩 올라갈지도 여기서 고른다.
 */
function 출발창(층){
  const 덮 = document.createElement("div"); 덮.id = "덮개";
  const 그리자 = () => {
    덮.innerHTML = `<div class="카드" onclick="event.stopPropagation()">
      <div class="nm"><b><span style="color:var(--금)">${층}층</span>${층 % 10 === 0 ? ` <span class="tag r">${말("ui.boss")}</span>` : ""}</b>
        <i>누구를 데려갈까 · ${S.파티.length}/${파티한도}</i></div>
      <!-- 10-10 사장님: 글자 체크박스를 치우고 초상화 슬롯 다섯 칸으로.
           윗줄은 데려갈 자리, 아랫줄은 남은 대원. 누르면 오가고, 빈 칸이 몇인지 바로 보인다.
           (이 주석은 템플릿 문자열 안이다 — 여기에 백틱을 쓰면 템플릿이 끊긴다. 10-10 그래서 한 번 터졌다.) -->
      <!-- 10-10 사장님: 진행 점은 뺐다 — 들어가고 나면 중간에 못 바꾸니 보여 줄 것이 없다.
           파티는 **네 자리**가 한계(사장님). -->
      <div class="칸이름">최대 ${파티한도}인 파티 편성</div>
      <div class="슬롯판">${Array.from({ length: 파티한도 }, (_, i) => {
        const id = S.파티[i], c = id != null ? S.대원.find((x) => x.id === id) : null;
        const d = c ? 카드(c) : null;
        return `<div class="칸슬롯${c ? " 참" : ""}" ${c ? `data-넣="${c.id}"` : ""}>
          <span class="번호">${i + 1}</span>
          ${c ? `<div class="큰낯" style="border-color:${등급색[d.등급]};background-image:url(${얼굴(d.그림)})"></div>
                 <b>${말값(d.직업)} Lv.${c.레벨}</b><i class="참">${말("ui.onField")}</i>`
              : `<div class="더하기">+</div><i>${말("ui.waiting")}</i>`}</div>`;
      }).join("")}</div>
      <div class="칸이름">대원 — 누르면 넣고 뺀다</div>
      <div class="출전줄 고르기">${S.대원.map((c) => { const d = 카드(c), 안 = S.파티.includes(c.id);
        return `<div class="자리${안 ? " 켬" : ""}" data-넣="${c.id}">
          <div class="낯" style="border-color:${안 ? 등급색[d.등급] : "#3a2c45"};background-image:url(${얼굴(d.그림)})"></div>
          <b>${말값(d.직업)}</b><i>${안 ? 말("ui.fielded") : `Lv.${c.레벨}`}</i></div>`; }).join("")
        || `<div class="자리 빈자리"><i>${말("ui.noMember")}</i></div>`}</div>
      <div class="칸이름">전투 준비</div>
      <div class="준비줄">
        <div class="준비칸">
          <div class="준비머리">${아이콘("i-약")} 물약</div>
          <div class="준비속">
            <b>별빛 회복약 ${S.가방.약}</b>
            <span class="수조절">
              <span data-약="-1">−</span><b class="몇">${S.약수 ?? 0}</b><span data-약="1">+</span>
            </span></div>
        </div>
        <div class="준비칸 흐림">
          <div class="준비머리">${아이콘("s-scroll")} ${말("ui.supplies")}</div>
          <div class="준비속"><i>아직 없다</i></div>
        </div>
      </div>
      <div class="칸이름">자격</div>
      <div class="자격칸">${자격(층).줄.map((r) =>
        `<div class="조건줄${r.됨 ? " 참" : ""}"><span>${r.이름}</span><b>${r.지금}</b></div>`).join("")}</div>
      <!-- 10-09 사장님 구성: 올라가는 단추가 없다. 들어가서 되돌이로 돌며 자격을 채운다. -->
      <div class="줄"><button class="btn 큰단추" id="들어가기">전투 시작 (${층}층)</button></div>
      <div class="줄"><button class="btn" id="닫기">${말("ui.close")}</button></div>
    </div>`;
    덮.querySelectorAll("[data-넣]").forEach((b) => b.onclick = () => {
      const id = Number(b.dataset.넣);
      if (S.파티.includes(id)) S.파티 = S.파티.filter((x) => x !== id);
      else if (S.파티.length < 파티한도) S.파티.push(id);
      그리자();
    });
    덮.querySelectorAll("[data-약]").forEach((b) => b.onclick = (ev) => {
      ev.stopPropagation();

      덮.remove();

      // 윗줄()이 전투 칸을 다시 펴므로, 크기()는 그 뒤에 불러야 한다 — 접힌 칸은 폭이 0이다
      전투준비(); 적만들기(); 윗줄(); 크기(); 그리기(); 화면(); 저장();

/**

const 전투력 = (c) => Math.round(최대체력(c) / 8 + 공격력(c) * 3 + 방어력(c) * 1.6 + 속도(c) * .6);

function 대원창(el){

    ${S.대원탭 === "장비"

         ${S.가방슬롯 ? 가방패널(S.가방슬롯, c)
           : `<div class="row"><div class="nm"><i>${말("ui.slotHint")}</i></div></div>`}`
      : S.대원탭 === "강화"

  el.querySelectorAll("[data-슬롯]").forEach((b) => b.onclick = () => {

  el.querySelectorAll("[data-벗김]").forEach((b) => b.onclick = () => { 벗기(Number(b.dataset.벗김)); 저장(); 칸(); });

    풀이칸.innerHTML = `<b>${말값(이름)}</b><br>${글 ? 글(c) : 말("ui.noDesc")}`;

/**
 * **가방 — 아래로 펼쳐지는 패널** (10-10 사장님 "슬롯 터치 시 **아래 가방 패널**이 열려 바로 비교").
 *
 * 처음엔 모달로 만들었는데, 사장님이 없애라고 한 바로 그 팝업을 다시 만든 꼴이었다.
 * 패널이면 **위의 슬롯과 아래의 후보가 한 화면에** 있어서 끼운 것과 견주며 고를 수 있다.
 * 지금 낀 것보다 나은지는 **숫자로** 같이 적는다 — 이름만 보고는 모른다.
 */
function 가방패널(슬롯, c){
  const 들 = S.가방.장비.filter((x) => 레시피[x.키].슬롯 === 슬롯);
  const 낀것 = 들.find((x) => x.누구 === c.id);
  const 값 = (키) => Object.values(레시피[키].효과 ?? {}).reduce((a, b) => a + Number(b), 0);
  const 지금값 = 낀것 ? 값(낀것.키) : 0;
  return `<div class="가방패널">
    <div class="가방머리">가방 · ${슬롯} <span>${들.length}개</span></div>
    <div class="가방격자">
      ${낀것 ? `<div class="칸짜리 벗기" data-벗김="${낀것.id}">
          <div class="이름">벗는다</div><div class="수">빈 칸으로</div></div>` : ""}
      ${들.length ? 들.map((x) => {
        const r = 레시피[x.키], 낌 = x.누구 === c.id;
        const 남 = x.누구 != null && !낌 ? S.대원.find((y) => y.id === x.누구) : null;
        const 차 = 값(x.키) - 지금값;
        return `<div class="칸짜리${낌 ? " 낌" : ""}" data-낄="${x.id}">
          ${물건아이콘[x.키] ? 아이콘(물건아이콘[x.키]) : ""}
          <div class="이름">${r.이름}</div>
          <div class="수">${낌 ? "끼는 중" : 남 ? 카드(남).직업
            : 차 > 0 ? `<span style="color:#8fe08f">+${수(차)}</span>`
            : 차 < 0 ? `<span style="color:#ff8e7a">${수(차)}</span>` : "같다"}</div></div>`;
      }).join("") : `<div class="칸짜리 빔"><div class="이름">없다</div>
          <div class="수">대장간에서</div></div>`}
    </div></div>`;
}
/**
 * **가방 — 독립 창** (10-10 사장님 "독립된 그리드 아이템창 신설, 재료 / 장비 / 소모품 탭 분류").

function 가방창(){

            return `<div class="칸짜리${낌 ? " 낌" : ""}" data-영혼석="${k}">
              ${영혼석아이콘[k] ? 아이콘(영혼석아이콘[k]) : ""}

          <div class="풀이 on">누르면 끼우고 뺀다. <b>액티브</b>는 주인의 기술을 바꾸고, <b>패시브</b>는 <b>한 칸만</b> 켤 수 있다.</div>`
        : `<div class="풀이 on">${말("ui.noStones")}</div>`;
    } else {
      속 = `<div class="가방격자"><div class="칸짜리${g.약 > 0 ? "" : " 빔"}" data-소모="약">
          ${아이콘("i-약")}<div class="이름">${말값("별빛 회복약")}</div><div class="수">${수(g.약 ?? 0)}</div></div></div>
        <div class="풀이 on">${말("ui.consumHint")}</div>`;
    }

        <i style="color:var(--흐림);font-size:12px">${말("ui.bagHead", { gold: 말("ui.gold"), g: 수(S.금화), dust: 말("ui.stardust"), d: 수(g.별가루 ?? 0) })}</i></div>
      <div class="서브탭" style="margin-top:8px">${[["재료","m-파편"], ["장비","s-gear"], ["영혼석","s-gear"], ["소모품","i-약"]].map(([t, ic]) =>
        `<span class="${탭 === t ? "on" : ""}" data-가방탭="${t}"><img src="art/icon/${ic}.png" alt="">${말값(t)}</span>`).join("")}</div>

    덮.querySelectorAll("[data-템]").forEach((b) => b.onclick = () => 물건창({ 종류: "장비", id: Number(b.dataset.템) }));
    덮.querySelectorAll("[data-소모]").forEach((b) => b.onclick = () => 물건창({ 종류: "소모품" }));
    덮.querySelectorAll("[data-영혼석]").forEach((b) => b.onclick = () => {
      const k = b.dataset.영혼석, d = 영혼석표[k];
      S.영혼석 ??= { 가진:{}, 낀액티브:[], 낀패시브:null };
      if (d.종류 === "액티브") {
        const 들 = S.영혼석.낀액티브;

      }
      저장(); 그리자();

    덮.querySelector("#닫기").onclick = () => 덮.remove();

  덮.onclick = () => 덮.remove();
  그리자();

/** **물건 하나를 자세히** (사장님 "아이템 카드를 누르면 아이템 상세 정보"). 판매는 아직 없다. */
function 물건창(무엇){
  let 제목 = "", 속 = "";
  if (무엇.종류 === "재료") {
    const k = 무엇.키, 쓰는곳 = Object.values(레시피).filter((r) => r.재료[k]);
    제목 = 재료이름[k];
    속 = `<div class="자격칸">
        <div class="조건줄 참"><span>가진 것</span><b>${수(S.가방[k] ?? 0)}</b></div>
        <div class="조건줄"><span>나오는 곳</span><b>${재료출처[k] ?? "?"}</b></div>
        ${매대[k] ? `<div class="조건줄"><span>${말("ui.marketPrice")}</span><b>${수(매대[k].값)} 금화</b></div>` : ""}
      </div>
      <div class="풀이 on">${쓰는곳.length
        ? `<b>${말("ui.usedIn")}</b><br>${쓰는곳.map((r) => `· ${r.이름} (${r.재료[k]}개)`).join("<br>")}`
        : "아직 쓰는 곳이 없다."}</div>`;
  } else if (무엇.종류 === "장비") {
    const x = S.가방.장비.find((y) => y.id === 무엇.id); if (!x) return;
    const r = 레시피[x.키], 쥔 = x.누구 != null ? S.대원.find((c) => c.id === x.누구) : null;
    제목 = r.이름;
    속 = `<div class="자격칸">
        <div class="조건줄 참"><span>칸</span><b>${r.슬롯}</b></div>
        ${Object.entries(r.효과 ?? {}).map(([칸, v]) => `<div class="조건줄 참"><span>${칸}</span><b>+${수(v)}</b></div>`).join("")}
        <div class="조건줄${쥔 ? " 참" : ""}"><span>지금</span><b>${쥔 ? `${말("ui.equippedBy", { who: 말값(카드(쥔).직업) })}` : "아무도 안 낌"}</b></div>
      </div>
      <div class="풀이 on">${말("ui.fitHint")}</div>`;
  } else {
    제목 = "별빛 회복약";
    속 = `<div class="자격칸"><div class="조건줄 참"><span>가진 것</span><b>${수(S.가방.약 ?? 0)}</b></div></div>
      <div class="풀이 on">전투 중 처음으로 절반 아래로 떨어진 아군의 체력을 <b>20%</b> 되살린다.
        한 병에 한 번. 떠나기 전에 몇 병 챙길지 고른다.</div>`;
  }
  const 덮 = document.createElement("div"); 덮.id = "덮개"; 덮.style.zIndex = "50";
  덮.innerHTML = `<div class="카드" onclick="event.stopPropagation()">
    <div class="nm"><b style="display:block;font-size:15px">${제목}</b></div>
    ${속}<div class="줄"><button class="btn" id="닫기">${말("ui.close")}</button></div></div>`;
  덮.onclick = () => 덮.remove();
  document.body.appendChild(덮);
  덮.querySelector("#닫기").onclick = () => 덮.remove();
}

/**
 * **갈래 카드** (10-10 사장님 시안 2차). 대장간과 시장은 먼저 **두 갈래**로 갈린다.
 * 진행 점은 넣지 않는다 — 들어가고 나면 중간에 못 바꾸니 보여 줄 것이 없다(사장님).
 */
const 단계표 = () => S.최고층 >= 20 ? "T3" : S.최고층 >= 10 ? "T2" : "T1";
function 갈래판(제목, 밑글, 카드들){
  return `<div class="갈래머리">${제목} <span>(${단계표()})</span></div>
    <div class="갈래밑">${밑글}</div>
    <div class="갈래줄">${카드들.map((c, i) => `
      <div class="갈래칸${c.열림 ? " 열림" : " 잠김"}" ${c.열림 ? `data-갈래="${c.키}"` : ""}>
        <span class="갈래번호">${i + 1}</span>
        <div class="갈래그림">${아이콘(c.그림)}</div>
        <div class="갈래이름">${c.이름}${c.열림 ? " ▶" : ""}</div>
      </div>`).join("")}</div>
    <div class="갈래줄 쪽글">${카드들.map((c) =>
      `<div class="갈래쪽${c.열림 ? " 열림" : ""}">${c.쪽글}</div>`).join("")}</div>`;
}

/**
 * **별가루 뽑기** (10-11). 한 번 돌린 결과를 그대로 돌려준다.
 *
 * 등급: SSR 5% · SR 25% · R 70%.
 *  · SSR·SR 은 **동료 완제품**. 이미 가진 동료가 또 나오면 **승급 조각 30개**로 바뀐다
 *    (레벨이나 능력치로 바꾸지 않는다 — 그러면 장비를 만들 이유가 사라진다)
 *  · R 은 조각·재료·금화를 섞는다. 매 판이 빈손이면 돌릴 맛이 없다
 *
 * **천장**: 30번째마다 SSR 확정. 뽑은 수는 저장에 남는다.
 */
function 한번뽑기(){
  S.뽑은수 = (S.뽑은수 ?? 0) + 1;
  const 천장 = S.뽑은수 % 뽑기값.천장 === 0;
  const r = Math.random();
  let 급 = 천장 ? "SSR" : r < .05 ? "SSR" : r < .30 ? "SR" : "R";

  if (급 === "SSR" || 급 === "SR") {
    const 들 = 뽑기동료().filter((x) => x.등급 === 급);
    const 안가진 = 들.filter((x) => !가진동료(x.키));
    if (안가진.length) {
      const 고른 = 안가진[Math.floor(Math.random() * 안가진.length)];
      const 새 = 대원만들기(고른.키, Math.max(1, ...S.대원.map((c) => c.레벨)));
      S.대원.push(새);
      return { 급, 종류: "동료", 키: 고른.키, 이름: 카드(새).직업, 새것: true };
    }
    if (들.length) {   // 이미 다 가졌다 → 조각
      S.조각 = (S.조각 ?? 0) + 30;
      return { 급, 종류: "조각", 수: 30, 이름: `${말("ui.dupe", { g: 급 })}`, 새것: false };
    }
    급 = "R";          // 그 등급에 동료가 아직 없으면 R 로 떨어진다
  }

  // R — 조각·재료·금화를 섞는다
  const 굴 = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const 뽑 = Math.random();
  if (뽑 < .4) { const n = 굴(3, 6); S.조각 = (S.조각 ?? 0) + n;
    return { 급:"R", 종류:"조각", 수:n, 이름:"승급 조각" }; }
  if (뽑 < .8) {
    const 열린 = Object.keys(재료이름).filter((k) => k !== "별가루");
    const k = 열린[Math.floor(Math.random() * 열린.length)], n = 굴(2, 6);
    S.가방[k] = (S.가방[k] ?? 0) + n;
    return { 급:"R", 종류:"재료", 키:k, 수:n, 이름:재료이름[k] };
  }
  const g = 굴(300, 900) * 2; S.금화 += g;
  return { 급:"R", 종류:"금화", 수:g, 이름:"금화" };
}

/** 여러 번 돌린다. 모자라면 돌린 만큼만 돌려준다. */
function 뽑기(횟수){
  const 값 = 횟수 >= 10 ? 뽑기값.열번 : 뽑기값.한번 * 횟수;
  if ((S.가방.별가루 ?? 0) < 값) return null;
  S.가방.별가루 -= 값;
  const 들 = [];
  for (let i = 0; i < 횟수; i++) 들.push(한번뽑기());
  윗줄(); 저장();
  return 들;
}

/** 뽑기 창 — 돌리고, 나온 것을 보여 준다 */
function 뽑기창(){
  const 덮 = document.createElement("div"); 덮.id = "덮개";
  let 결과 = null;
  const 그리자 = () => {
    const 별 = S.가방.별가루 ?? 0;
    const 남 = 뽑기값.천장 - ((S.뽑은수 ?? 0) % 뽑기값.천장);
    덮.innerHTML = `<div class="카드" onclick="event.stopPropagation()">
      <div class="nm"><b style="display:block;font-size:15px">소환</b>
        <i style="color:var(--흐림);font-size:12px">별가루 ${수(별)} · 승급 조각 ${수(S.조각 ?? 0)}</i></div>
      <div class="자격칸" style="margin-top:8px">
        <div class="조건줄 참"><span>SSR 동료</span><b>5%</b></div>
        <div class="조건줄 참"><span>SR 동료</span><b>25%</b></div>
        <div class="조건줄"><span>조각 · 재료 · 금화</span><b>70%</b></div>
        <div class="조건줄"><span>천장까지</span><b>${남}번</b></div>
      </div>
      ${결과 ? `<div class="칸이름">${말("ui.pulled")}</div><div class="가방격자">${결과.map((x) => `
        <div class="칸짜리${x.종류 === "동료" ? " 낌" : ""}">
          <div class="이름">${x.이름}</div>
          <div class="수">${x.종류 === "동료" ? `<span style="color:var(--금)">${말("ui.joined", { g: x.급 })}</span>`
            : x.종류 === "금화" ? `+${수(x.수)}` : `+${x.수}`}</div></div>`).join("")}</div>` : ""}
      <div class="줄">
        <button class="btn" id="한번" ${별 >= 뽑기값.한번 ? "" : "disabled"}>1회 · ${수(뽑기값.한번)}</button>
        <button class="btn" id="열번" ${별 >= 뽑기값.열번 ? "" : "disabled"}>10회 · ${수(뽑기값.열번)}</button>
      </div>
      <div class="풀이 on">뽑기는 <b>동료와 재료</b>만 준다. 레벨과 능력치는 끝까지
        <b>대장간 장비</b>와 <b>층</b>으로만 오른다.<br>
        별가루는 출석(50) · 첫 클리어(15, 보스 100) · <b>보스를 다시 깰 때마다 50</b>.</div>
      <div class="줄"><button class="btn" id="닫기">${말("ui.close")}</button></div></div>`;
    const 돌려 = (n) => { const r = 뽑기(n); if (r) { 결과 = r; 그리자(); 길드그리기(); } };
    덮.querySelector("#한번").onclick = () => 돌려(1);
    덮.querySelector("#열번").onclick = () => 돌려(10);
    덮.querySelector("#닫기").onclick = () => 덮.remove();
  };
  덮.onclick = () => 덮.remove();
  그리자();
  document.body.appendChild(덮);
}

function 칸(){
  const el = $("#panel");
  if (S.탭 === "run" || S.탭 === "hall") { el.className = ""; el.innerHTML = ""; return; }
  el.className = "open";
  if (S.탭 === "crew" && S.보는대원 != null) { 대원창(el); return; }
  if (S.탭 === "crew") {
    /**
     * 10-09 사장님 "캐릭터 창 간단하게 — 직업 레벨 등급까지만 보여주고 누르면 카드 창".
     * 목록은 **누구인지 알아볼 만큼만** 싣는다. 능력치·장비·대표는 카드 창으로 옮겼다 —
     * 한 줄에 다 넣으니 넷만 돼도 화면이 글자 벽이 됐다.
     * "내리기·태우기 지우고"(사장님) — 출전은 카드 창에서 고른다.
     */
    // 10-09 사장님 "캐릭터 창에 별빛회복약 안 보이게" — 약은 떠나기 직전에 챙기는 것이라 출발 창으로 옮겼다
    el.innerHTML = S.대원.map((c) => {
      const 안에 = S.파티.includes(c.id), d = 카드(c);
      return `<div class="row 카드열기" data-카드="${c.id}" style="cursor:pointer">
        <div class="얼굴" style="border-color:${등급색[d.등급]};background-image:url(${얼굴(d.그림)})"></div>
        <div class="nm"><b><span style="color:${등급색[d.등급]}">${말값(d.직업)}</span>
          <span style="color:#a8977f">Lv.${c.레벨}</span>
          <span class="tag" style="color:${등급색[d.등급]}">${말값(d.등급)}</span>${안에 ? `<span class="tag r">${말("ui.fielded")}</span>` : ""}${S.대표===c.id ? `<span class="tag">${말("ui.leader")}</span>` : ""}</b></div>
        <span style="color:#6e5d78;font-size:18px;padding:0 4px">›</span></div>`;
    }).join("");
    el.querySelectorAll("[data-카드]").forEach((b) => b.onclick = () => { S.보는대원 = Number(b.dataset.카드); 칸(); });
  } else if (S.탭 === "forge") {
    /**
     * **대장간** (10-09 사장님 "대장간이랑 시장 시스템 디테일하게 처음부터 다시 만들").
     *
     * 전에는 레시피를 한 줄씩 늘어놓기만 했다. 세 가지를 더했다:
     *  ① **층대(T1·T2·T3)로 묶는다** — 지금 내가 어느 단계에 있는지가 목록에서 보인다
     *  ② **재료를 칸으로** 보여 준다. 모자란 것은 붉고, 모자란 만큼이 숫자로 남는다
     *  ③ **지금 낀 것과 견준다** — 만들면 누가 얼마나 좋아지는지. 이름만 보고는 모른다
     * 재료 이름은 `재료이름` 한 곳에서만 가져온다(두 군데 적었다가 undefined 가 다섯 개 찍혔다).
     */
    const g = S.가방;
    if (S.최고층 < 3) { el.innerHTML = `<div class="row"><div class="nm"><b>${말("tab.forge")}</b><i>${말("forge.locked", { n: S.최고층 })}</i></div></div>`; return; }
    if (!S.대장갈래) {
      el.innerHTML = 갈래판(말("tab.forge"), 말("forge.sub"), [
        { 키:"강화", 이름:말("forge.upgrade"), 그림:"c-upgrade", 열림:false, 쪽글:말("forge.upgradeSub") },
        { 키:"제작", 이름:말("forge.craft"), 그림:"c-craft", 열림:true, 쪽글:말("forge.craftSub") },
      ]);
      el.querySelectorAll("[data-갈래]").forEach((b) => b.onclick = () => { S.대장갈래 = b.dataset.갈래; 칸(); });
      return;
    }

    const 단계 = (r) => r.열림 >= 20 ? "T3 · 20층 위" : r.열림 >= 10 ? "T2 · 10층 위" : "T1 · 처음";
    const 값 = (키) => Object.values(레시피[키].효과 ?? {}).reduce((a, b) => a + Number(b), 0);
    /** 이걸 만들면 **누가** 가장 좋아지나 — 그 슬롯이 비었거나 더 나쁜 것을 낀 대원 */
    const 쓸사람 = (키) => {
      const r = 레시피[키]; if (r.슬롯 === "약") return null;
      let 좋 = null, 폭 = 0;
      for (const c of S.대원) {
        const 낀 = 장비들(c).find((x) => 레시피[x.키].슬롯 === r.슬롯);
        const 차 = 값(키) - (낀 ? 값(낀.키) : 0);
        if (차 > 폭) { 폭 = 차; 좋 = c; }
      }
      return 좋 ? { 누구: 카드(좋).직업, 폭 } : null;
    };

    const 칸들 = (r) => Object.entries(r.재료).map(([k, n]) => {
      const 가진 = g[k] ?? 0, 됨 = 가진 >= n;
      return `<span class="재료칸${됨 ? " 참" : ""}">${아이콘("m-" + k)}${재료이름[k] ?? k}
        <b>${가진}/${n}</b>${됨 ? "" : `<i>${말("ui.short", { n: n - 가진, where: 말값(재료출처[k] ?? "") })}</i>`}</span>`;
    }).concat(`<span class="재료칸${S.금화 >= r.금화 ? " 참" : ""}">금화 <b>${수(r.금화)}</b>${
      S.금화 >= r.금화 ? "" : `<i>${말("ui.shortGold", { n: 수(r.금화 - S.금화) })}</i>`}</span>`).join("");

    const 가방줄 = Object.keys(재료이름).filter((k) => (g[k] ?? 0) > 0)
      .map((k) => `${말값(재료이름[k])} ${g[k]}`).join(" · ") || "재료가 없다";

    let 글 = `<div class="머리띠"><span class="뒤로" id="갈래뒤로">‹ 대장간</span></div>
      <div class="row"><div class="nm"><b>가방</b><i>${가방줄} · 금화 ${수(S.금화)}</i></div></div>`;
    let 앞단계 = "";
    for (const [k, r] of Object.entries(레시피)) {
      const 없 = 모자람(k), 잠김 = S.최고층 < r.열림, 된다 = !잠김 && !없.length;
      if (단계(r) !== 앞단계) { 앞단계 = 단계(r); 글 += `<div class="단계줄">${앞단계}</div>`; }
      const 쓸 = 된다 ? 쓸사람(k) : null;
      글 += `<div class="row${된다 ? " 된다" : ""}${잠김 ? " 잠김" : ""}">
        ${물건아이콘[k] ? `<div class="템아이콘">${아이콘(물건아이콘[k])}</div>` : ""}
        <div class="nm"><b>${r.이름} <span class="tag">${r.슬롯}</span>${
          된다 ? `<span class="tag r">${말("ui.canMake")}</span>` : ""}</b>
          <i>${r.글}</i>
          ${잠김 ? `<i style="color:#6e5d78">${말("ui.opensAbove", { n: r.열림 })}</i>`
                 : `<div class="재료줄">${칸들(r)}</div>`}
          ${쓸 ? `<i style="color:var(--초록)">${말("ui.fitGain", { who: 말값(쓸.누구), n: 수(쓸.폭) })}</i>` : ""}</div>
        <button class="btn" data-make="${k}" ${잠김 || 없.length ? "disabled" : ""}>만들기</button></div>`;
    }
    글 += `<div class="row"><div class="nm"><i>${말("ui.forgeHint")}</i></div></div>`;
    el.innerHTML = 글;

/** 길드에 서 있는 대표. 크게 — 여기가 이 사람을 보는 자리다. */
const hcv = $("#hcv"), hctx = hcv.getContext("2d");
/**
 * **폐허 위 야영지** (10-07 사장님). 배경은 192×344 도트 — 캐릭터를 자를 때와 같은 비율로 줄인 것이라
 * **같은 배율로 그리면 도트 한 칸 크기가 맞는다.** 캐릭터만 크게 키우면 붙여 넣은 스티커로 보인다.
 * 좌표는 전부 배경 도트 칸 단위(불 97,178 · 캐릭터 발 96,216).
 */
const 야영 = { 불:{ x:97, y:178 }, 발:{ x:96, y:252 } };   // 발은 불 앞 빈 땅 — 216 에선 불을 가렸다(10-07)
/** 길드 홀(384×256) 기준 자리 — 탁자 위 촛불과, 대표가 설 바닥 (10-10 사장님 시안) */
const 홀자리 = { 폭:384, 높:256, 불:{ x:192, y:140 }, 발:{ x:192, y:236 } };
const 길드알 = [];
let 길드앞 = Date.now();
function 길드그리기(){
  const r = hcv.getBoundingClientRect(), d = devicePixelRatio || 1;
  if (!r.width) return;
  if (hcv.width !== Math.round(r.width*d) || hcv.height !== Math.round(r.height*d)) {
    hcv.width = Math.round(r.width*d); hcv.height = Math.round(r.height*d);
  }
  hctx.setTransform(d,0,0,d,0,0); hctx.imageSmoothingEnabled = false;
  const w = r.width, h = r.height;
  const dt = Math.min(.1, (Date.now() - 길드앞)/1000); 길드앞 = Date.now();
  hctx.fillStyle = "#1a1420"; hctx.fillRect(0,0,w,h);

  /* 10-10 사장님 시안: 야영지 대신 **길드 홀**(방 안). 아직 안 받았으면 야영지로 버틴다. */
  const 쓸만2 = (im) => !!(im && im.complete && im.naturalWidth);
  const 홀 = 쓸만2(그림.hall), bg = 홀 ? 그림.hall : (쓸만2(그림.camp) ? 그림.camp : null);
  const 밑 = 홀 ? 홀자리 : { 폭:192, 높:344, ...야영 };
  const s = Math.max(w/밑.폭, h/밑.높);                       // 화면을 덮는 배율
  const ox = Math.round((w - 밑.폭*s)/2), oy = Math.round((h - 밑.높*s)/2);
  const 칸 = (p) => ({ x: ox + p.x*s, y: oy + p.y*s });
  if (bg) hctx.drawImage(bg, ox, oy, 밑.폭*s, 밑.높*s);

  // 모닥불 불씨 · 하늘의 초록 먼지 — 칸 크기를 배경 도트에 맞춘다
  const 불 = 칸(밑.불), 점 = Math.max(2, Math.round(s));
  if (Math.random() < dt*22) 길드알.push({ x:불.x + 무작(-6,6), y:불.y, vx:무작(-8,8), vy:무작(-48,-22), t:0, 수명:무작(.7,1.5),
    색: Math.random() < .3 ? "#ffe08a" : "#ff8a3a" });
  if (Math.random() < dt*3) 길드알.push({ x:무작(0,w), y:무작(h*.05,h*.45), vx:무작(4,12), vy:무작(-4,4), t:0, 수명:무작(3,6), 색:"#ffe9a0", 흐림:true });   // 반딧불 — 초록 방사능 먼지는 티가 나서 뺐다(10-07)
  for (const q of 길드알) { q.t += dt; q.x += q.vx*dt + (q.흐림 ? 0 : Math.sin(q.t*6)*.3); q.y += q.vy*dt; }
  for (let i = 길드알.length-1; i >= 0; i--) if (길드알[i].t > 길드알[i].수명) 길드알.splice(i, 1);
  // 불빛이 일렁인다
  hctx.save(); hctx.globalCompositeOperation = "lighter";
  hctx.globalAlpha = .1 + Math.sin(Date.now()/90)*.03 + Math.random()*.02;
  const 빛 = hctx.createRadialGradient(불.x, 불.y, 2, 불.x, 불.y, 34*s);
  빛.addColorStop(0, "#ff9a40"); 빛.addColorStop(1, "rgba(255,120,40,0)");
  hctx.fillStyle = 빛; hctx.fillRect(불.x - 34*s, 불.y - 34*s, 68*s, 68*s);
  for (const q of 길드알) {
    const k = q.t/q.수명;
    hctx.globalAlpha = q.흐림 ? Math.sin(k*Math.PI)*.45 : 1 - k;
    hctx.fillStyle = q.색; hctx.fillRect(Math.round(q.x), Math.round(q.y), 점, 점);
  }
  hctx.restore();

  const c = S.대원.find((x) => x.id === S.대표 && x.살아있나) ?? S.대원.find((x) => x.살아있나);
  if (!c) { hctx.fillStyle="#c9b48a"; hctx.font="14px Malgun Gothic"; hctx.textAlign="center";
            hctx.fillText("야영지가 비었다", w/2, h/2); return; }
  S.대표 = c.id;
  const im = 칸고르기(카드(c).그림);
  if (im) {
    const 발 = 칸(밑.발), 크w = im.naturalWidth*s, 크h = im.naturalHeight*s;
    hctx.save(); hctx.globalAlpha = .4; hctx.beginPath();
    hctx.ellipse(발.x, 발.y, 크w*0.28, 3*s, 0, 0, 7); hctx.fillStyle="#000"; hctx.fill(); hctx.restore();
    hctx.drawImage(im, Math.round(발.x - 크w/2), Math.round(발.y - 크h + 2*s), 크w, 크h);
  }
  $("#repName").textContent = 말값(c.이름);
  const 판 = 카드(c);
  $("#repName").style.color = 등급색[판.등급];
  $("#repAge").textContent = `${말값(판.등급)} · ${말값(판.직업)} · Lv.${c.레벨}`;
  $("#repRole").textContent = `${말("stat.hp")} ${수(최대체력(c))} · ${말("stat.atk")} ${수(공격력(c))}`
    + ` · ${말("stat.def")} ${수(방어력(c))} · ${말("stat.spd")} ${속도(c)}`;
  $("#bondBar").style.width = Math.min(100, c.경험/필요경험(c)*100) + "%";
}

Object.assign(window, { S, 맵그리기, 출발창, 화면, 한턴, 적만들기, 무리수, 파티한도, 판끝, 자격, 열린층, 필요판, 최대체력, 공격력, 방어력, 전멸, 기술표, 도감, 빛셈, 빛표, 대원만들기, 방어뒤, 결의배, 도감, 기술설명, 특성설명, 스킬들, 대원창, 가방패널, 가방창, 물건창, 전투력, 레벨상한, 필요경험, 벗기, 칸, 만들기, 모자람, 장착, 레시피, 재료이름, 재료출처, 물건아이콘, 구간, 구간들, 매대, 사기, 남은수, 뽑기, 한번뽑기, 뽑기창, 뽑기값, 뽑기동료, 산수, 매대확인, 전투준비, 금화보상, 저장, 불러오기, 지우기,
